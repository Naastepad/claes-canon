cross_cutting_scene_filters:
  religion:
    - "What public worship is permitted here, at this date?"
    - "What remains privately practiced despite public rules?"
    - "How has the same church building changed in sound, objects, access and authority?"
  war:
    - "Is this place front, rear area, supply route, garrison, siege zone or maritime corridor?"
    - "What can civilians perceive: billets, taxes, prices, bells, ships, refugees, wounded, requisitions, rumours?"
  civic_culture:
    - "What happens to guild, confraternity and rhetorician functions under confessional/political pressure?"
  memory:
    - "Separate event, Claes' perception, later story and public commemoration."
  print_books:
    - "Track censorship, confessional provenance, reprints, migration of printers and changed meanings of the same text/object."

