  DIRECT_ROUTE: "Event affects ordinary travel/education/trade routes: Goes, Middelburg, Arnemuiden, Vlissingen, Veere or Antwerp."
  ROUTE_NEWS: "News carried by ships, merchants, students, soldiers, refugees, letters, vaten or books."
  PRINTED_NEWS: "Placards, books, pamphlets, schoolbooks, chronicles, bans or printer networks."
  RUMOUR: "Unstable oral report through herberg, harbour, market, gilde, ship, schoolyard or refugee channel."
  DELAYED_EFFECT: "Cause may remain unknown; consequence is felt later in route, price, gate, tax, licence or absence."
  INVISIBLE_CAUSE: "Council, court, royal, military or diplomatic decision probably not directly accessible."
  RESTRICTED_ACCESS: "Learned, chymical, clandestine or diplomatic knowledge; requires explicit access path."
