principles:
  - "News access is not the same as historical event knowledge."
  - "Claes receives events through routes, materials, people, institutions, delays and absences."
  - "Direct knowledge is strongest for Goes; route knowledge is strongest for Middelburg, harbour places and Antwerp."
  - "Invisible decisions must remain invisible unless a specific access channel is established."
  - "Event, perception, rumour, propaganda and later memory must remain separate."
access_labels:
