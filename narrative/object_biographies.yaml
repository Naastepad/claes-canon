schema_version: 1.0.0
kind: ObjectBiographyRegistry
objects:
  - id: OBJ.ZOVITIUS_SCHOOLBOOK
    label: "Claes' older water-marked Zovitius schoolbook"
    canon_status: CANON
    historical_status: HISTORICAL_WORK_FICTIONAL_COPY_HISTORY
    states:
      - id: OBJ.ZOVITIUS_SCHOOLBOOK.STATE.01
        phase: "Reimerswaal study"
        story_time: {earliest: 1554-01-01, latest_exclusive: 1561-09-01, precision: interval}
        condition: "complete schoolbook/text-form used in study"
      - id: OBJ.ZOVITIUS_SCHOOLBOOK.STATE.02
        phase: "water damage"
        story_time: {earliest: 1555-01-01, latest_exclusive: 1556-01-01, precision: year}
        condition: "band and edges distorted; text remains complete"
      - id: OBJ.ZOVITIUS_SCHOOLBOOK.STATE.03
        phase: "annotated use"
        condition: "teacher corrections plus Claes' marginal observations on usability, language and merels"
      - id: OBJ.ZOVITIUS_SCHOOLBOOK.STATE.04
        phase: "Silvius recognition"
        condition: "recognized as evidence of lived pedagogy, not as discovery of an unknown text"
    guardrails:
      - "Never conflate with OBJ.ZOVITIUS_1570_TRIGGER."
      - "Zovitius himself cannot meet Claes; his trace ends before Claes' birth."

  - id: OBJ.ZOVITIUS_1570_TRIGGER
    label: "Special 1570 Zovitius activation copy"
    canon_status: CANON
    historical_status: HISTORICAL_EDITION_FICTIONAL_MARKINGS
    states:
      - phase: "publication channel"
        story_time: {earliest: 1570-01-01, latest_exclusive: 1571-01-01, precision: year}
        condition: "special micro-markings select GALLA LEO VIRIDIS"
      - phase: "activation"
        effect: "reactivates personal Dee-memory and directs Claes toward testing the memoriaal"
    guardrails:
      - "Trigger, not complete key."

  - id: OBJ.MEMORIAAL
    label: "Claes' memoriaalboek"
    canon_status: CANON
    historical_status: FICTIONAL_OBJECT
    states:
      - id: OBJ.MEMORIAAL.STATE.PEDAGOGICAL
        story_time: {earliest: 1564-01-01, latest_exclusive: 1564-10-04, precision: bounded}
        condition: "ordinary-looking pedagogical workbook given before Boom"
      - id: OBJ.MEMORIAAL.STATE.RECOVERY_CARRIER
        story_time: {earliest: 1564-10-04, precision: lower-bound}
        condition: "blind recovery carrier after security break"
        hidden_structure:
          problem_rectos: 24
          key_rectos: 2
          hidden_layer: "tannin/galnut layer on rectos only"
          visible_before_activation: "red corner marks and limited registration puncta"
      - id: OBJ.MEMORIAAL.STATE.ACTIVATED
        story_time: {earliest: 1570-01-01, latest_exclusive: 1571-01-01, precision: year}
        condition: "dark hidden diagrams/text become readable after controlled green-vitriol development"
    deterministic_domains: [possession, knowledge, decode]

  - id: OBJ.MONAS_CLAES
    label: "Claes' personal 1564 Monas Hieroglyphica"
    canon_status: CANON
    historical_status: HISTORICAL_WORK_FICTIONAL_MARGINALIA
    states:
      - phase: "formation object"
        story_time: {earliest: 1564-01-01, precision: lower-bound}
      - phase: "recovery ordering key"
        story_time: {earliest: 1570-01-01, precision: lower-bound}
        condition: "24 fictional four-symbol marginal notae, one for every theorem"
    function: "ordering only"
    guardrails:
      - "Does not yield plaintext."
      - "Fictional cipher use is not claimed as Dee's historical published intent."

  - id: OBJ.DODOENS_CARRIER
    label: "Special Dodoens herb-book carrier"
    canon_status: CANON
    historical_status: HISTORICAL_WORK_FICTIONAL_CARRIER_PROVENANCE
    function: "nine botanical tables plus physical carrier addresses for nomenclator values"
    tables: [C, N, H, F, P, L, D, O, S]
    nomenclator_values: 5184
    states:
      - phase: "network object"
        note: "exact ownership route before Goes remains open"
      - phase: "Goese apothecary environment"
        story_time: {earliest: 1566-01-01, latest_exclusive: 1570-01-01, precision: bounded}
        status: STRONG_WORK_CANON
      - phase: "active decode carrier"
        story_time: {earliest: 1570-01-01, latest_exclusive: 1571-01-01, precision: year}
    guardrails:
      - "No leaf, vein, fruit or branch counting cipher."
      - "Without this carrier full content-value recovery is impossible."

  - id: OBJ.CASTANEA
    label: "Hand-coloured Castanea anchor in special Dodoens"
    canon_status: CANON
    historical_status: FICTIONAL_MARKING_ON_HISTORICAL_WORK
    function: "authentication and wayfinding"
    memory_anchor: "Castanea. Niet onze bloem — de boom."
    guardrails:
      - "No extra numeric layer."

  - id: OBJ.MERELS_24
    label: "Twenty-four recovery merels problem sheets"
    canon_status: CANON
    historical_status: HISTORICAL_PROBLEM_TRADITION_FICTIONAL_RECOVERY_USE
    count: 24
    reader_layer: "unnumbered complete sheets"
    author_layer: "P1-P14 and P16-P25 concordance IDs"
    output: "permutation of theorem I-XXIV exactly once"
    guardrails:
      - "P15 is research metadata, not an in-world missing puzzle."
      - "No fixed modern coordinate system in-world."
      - "Local letters and local stone forms have problem-local meaning."

  - id: OBJ.PRIMUS_INDEX
    label: "Primus Index"
    canon_status: CANON
    historical_status: FICTIONAL
    function: "rapid identity reveal after the Dodoens gate"
    identification_time_minutes: {min: 30, max: 60}
    guardrails:
      - "Reveals identity and purpose, not full plaintext."

  - id: OBJ.LASCASAS_CIPHERTEXT
    label: "FINAL CIPHER-1564 clandestine ciphertext"
    canon_status: CANON
    historical_status: FICTIONAL_CIPHERTEXT_BASED_ON_HISTORICAL_WORK
    frozen_metrics:
      plaintext_words: 30930
      nomenclator_values: 5184
      cipher_groups: 35584
      used_code_values: 4181
      round_trip_verified: true
    physical_model:
      pages_estimate: "66-75"
      sheets_estimate: "34-38"
      set_count_workcanon: "3-6"
    guardrails:
      - "Completed Diets/Brabant plaintext exists before encryption."
      - "Merels recovery does not recipher this stream."

  - id: OBJ.LASCASAS_PLAINTEXT
    label: "Reconstructed Diets/Brabant Las Casas plaintext"
    canon_status: CANON
    historical_status: FICTIONAL_EARLY_PROVENANCE
    states:
      - phase: "completed translation before Antwerp encryption"
      - phase: "reconstructed by Claes and beloved in 1570"
      - phase: "prepared for safe onward transmission"
      - phase: "led toward anonymous 1578 publication in novel canon"
    guardrails:
      - "Historical 1578 publication is real; Claes provenance is fictional."
