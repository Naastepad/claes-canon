    type: SceneInstance
    label: "3 August — intocht and separation"
    canon_status: CANON
    story_time: {date: '1561-08-03', precision: day}
    entities: [ENT.PERSON.CLAES, ENT.PERSON.CORNELIS]
    story_claims: [STC.CLAES.LANDJUWEEL.ENTRY_AUTONOMY.1561.001]
    historical_anchors:
    - SC.HIST.LANDJUWEEL.ENTRY_14_CHAMBERS.1561.001
    - SC.HIST.LANDJUWEEL.BRUSSELS_LAST_AFTER_2AM.1561.001
    action: "Claes and Cornelis watch the entry; Claes is separated from his father and sees the final Brussels chamber without paternal interpretation."
