  type: MacroArc
  label: Drager → Nigredo → Albedo → Rubedo → Projectio
  status: CANON
  phases:
  - label: Drager
    story_time:
      earliest: '1542-12-08'
      latest_exclusive: '1564-10-04'
      precision: bounded
  - label: Gebondenheid / macro-Nigredo
    story_time:
      earliest: '1564-10-04'
      latest_exclusive: '1585-01-01'
      precision: bounded
  - label: Albedo / Onderscheiding
    story_time:
      earliest: '1584-01-01'
      latest_exclusive: '1599-01-01'
      precision: approximate
  - label: Rubedo / Verbinding
    story_time:
      earliest: '1599-01-01'
      latest_exclusive: '1603-01-01'
      precision: approximate
  - label: Projectio / Overdracht
    story_time:
      earliest: '1602-01-01'
      precision: open-ended
  guardrail: authorial architecture, not an in-world universal alchemical doctrine; Reimerswaal 1554-1561 is a material prefiguration, not a relocation of the macro-Nigredo hinge
