schema_version: 1.1.0
kind: NarrativeArcRegistry
arcs:
- id: ARC.CLAES.LIFE
  type: CharacterArc
  label: Claes cradle-to-grave
  status: CANON
  protagonist: ENT.PERSON.CLAES
  phases:
  - id: ARC.CLAES.LIFE.P01
    label: Vroege vorming
    story_time:
      earliest: '1542-12-08'
      latest_exclusive: '1547-12-31'
      precision: approximate
    dominant_movement: ontvankelijkheid zonder duiding
    value_shift: sensory experience before explicit understanding
  - id: ARC.CLAES.LIFE.P02
    label: Kind dat orde ontdekt
    story_time:
      earliest: '1547-01-01'
      latest_exclusive: '1554-05-18'
      precision: approximate
    dominant_movement: Wijsheid en Hoop
    value_shift: order can be learned through attention
  - id: ARC.CLAES.LIFE.P03
    label: Reimerswaalse vormingsfase
    story_time:
      earliest: '1554-05-18'
      latest_exclusive: '1561-09-01'
      precision: bounded
    dominant_movement: Hoop under repeated material pressure
    value_shift: sudden fire displaces him; repeated water, rebuilding, collapse and fire teach that a place can remain inhabited while its form is already dissolving
    progression:
    - '1554: Goes fire breaks continuity and redirects the intended Zierikzee school route to Reimerswaal.'
    - '1555: first Reimerswaal dike failure personally experienced; water becomes the counterforce and amplifier of the Goes fire.'
    - '1557: walls, gates and civic/religious/economic structures fail under storm pressure; protection itself proves perishable.'
    - '1558: fire strikes the already water-damaged city, echoing Goes but in a body already weakened by repeated inundation.'
    - '1561: renewed inundation closes the Reimerswaal school phase as Claes leaves for Antwerp.'
    narrative_function: material prefiguration of Nigredo without moving the canonical adult macro-Nigredo start from 4 October 1564
  - id: ARC.CLAES.LIFE.P04
    label: Jonge man die leert interpreteren
    story_time:
      earliest: '1560-01-01'
      latest_exclusive: '1563-12-31'
      precision: overlap
    dominant_movement: from observation to judgement
    value_shift: roles and meanings diverge
  - id: ARC.CLAES.LIFE.P05
    label: Jonge zoeker
    story_time:
      earliest: '1564-01-01'
      latest_exclusive: '1565-01-01'
      precision: year
    dominant_movement: Kracht/Geloof begins
    value_shift: from observer to causal actor
  - id: ARC.CLAES.LIFE.P06
    label: Handelende volwassene
    story_time:
      earliest: '1565-01-01'
      latest_exclusive: '1578-01-01'
      precision: approximate
    dominant_movement: Kracht/Geloof under pressure
    value_shift: act without complete certainty
    reimerswaal_callback: the 1573-1574 war destruction and Battle of Reimerswaal transform the school-city of memory into a point-of-no-return image of human as well as natural destruction; Claes' exact physical presence is not fixed
  - id: ARC.CLAES.LIFE.P07
    label: Man in Nigredo
    story_time:
      earliest: '1578-01-01'
      latest_exclusive: '1585-01-01'
      precision: bounded
    dominant_movement: certainty dissolves
    value_shift: seeing is not enough
  - id: ARC.CLAES.LIFE.P08
    label: Rijpe man en bewaarder
    story_time:
      earliest: '1584-01-01'
      latest_exclusive: '1603-01-01'
      precision: approximate
    dominant_movement: Albedo to Rubedo
    value_shift: distinguish then reconnect
  - id: ARC.CLAES.LIFE.P09
    label: Laatste beweging en graf
    story_time:
      earliest: '1602-01-01'
      precision: open-ended
    dominant_movement: Projectio
    value_shift: transfer without possession
  knowledge_object_targets:
  - KO.STORY
  - KO.STRUCTURE
  - KO.VALUE
  - KO.CONFLICT
  - KO.EVENT
