schema_version: 1.1.0
kind: StoryProjectionRegistry
projections:
- id: ARC.CLAES.CAUSAL_SPINE
  type: CausalStoryProjection
  label: "Claes — causal spine from Status Prima to Projectio"
  canon_status: CANON
  protagonist: ENT.PERSON.CLAES
  authorial_architecture: ARC.CLAES.GREAT_WORK.AUTHORIAL
  counterpart_arc: ARC.MAYKEN.LIFE
  relationship_projection: REL.CLAES.MAYKEN.CONJUNCTIO
  purpose: "Bridge settled canon and chapter-ready world modules into a causal pre-structure before Book/Act/Sequence/Chapter/Beat realization."

  hinges:
  - id: H01
    story_time: {earliest: '1542-12-08', latest_exclusive: '1554-05-18', precision: bounded}
    label: "Status Prima — body, family, church, food, craft and routes form one lived world"
    cause: "Claes grows inside an intact household and a material/sensory civic order."
    effect: "He learns the useful but dangerous intuition that attention makes the world legible."
    registers: [Corpus, Anima, Spiritus]
    authoring_inputs: [WORLD.GOES, WORLD.BREAD_GRAIN, WORLD.BEER_BREWING_DISTRIBUTION, WORLD.RELIGIOUS_SPACE.SENSORY_CHURCH]

  - id: H02
    story_time: {date: '1554-05-18', precision: day}
    label: "Goes fire — first catastrophic solve"
    cause: "The historically grounded city fire intersects the fictional Nissepat household."
    effect: "House, mother, brother and unborn sibling are lost; Claes' belief in attention as protection is wounded rather than disproved in his own mind. Claes directly experiences the fire while Cornelis is absent from the immediate zone; grandfather remains present by burial/early aftermath."
    instances: [NI.EVENT.GOES_FIRE.1554.001]
    arcs_advanced: [ARC.CLAES.LIFE, ARC.CLAES.CORNELIS, ARC.CLAES.SINNE_RECOVERY]
    manuscript_structure: "multi-chapter catastrophe -> confirmation -> aftermath -> departure"

  - id: H03
    story_time: {earliest: '1554-05-19', latest_exclusive: '1561-09-01', precision: bounded}
    label: "Reimerswaal — learning under slow erosion"
    cause: "Post-fire economics replace the intended Zierikzee path with Reimerswaal, send eleven-year-old Claes toward a destination already planted as fearful, and separate father and son."
    effect: "Claes gains language/rule competence while repeated water/fire pressure turns attention into vigilance."
    instances: [NI.EVENT.REIMERSWAAL_MOVE.1554.001]
    authoring_inputs: [WORLD.REIMERSWAAL]
    manuscript_callbacks: ["De Kraai Reimerswaal dread -> De Kade specific recollection"]

  - id: H04
    story_time: {earliest: '1561-08-01', latest_exclusive: '1561-09-01', precision: month}
    label: "Landjuweel — meaning becomes multiple and judgement becomes partly his own"
    cause: "Eighteen-year-old Claes makes his first joint journey with Cornelis since 1554. Public rhetoric puts competing answers before him; separation in the 3 August night crowd briefly removes paternal mediation; Van Ghistele asks for Claes' own answer; Van Haecht's fictional deletion gesture makes textual risk visible."
    effect: "Claes moves from noticing patterns toward autonomous judgement of interpretation, role and consequence. He gives a provisional answer—'misschien datgene wat een mens mist'—without closing the question. Cornelis' final-evening acknowledgement creates a sincere but incomplete rapprochement, while the Landjuweel leaves images that acquire alchemical/initiatory ordering only much later."
    instances:
    - NI.EVENT.LANDJUWEEL.1561.001
    - NI.SCENE.LANDJUWEEL.ENTRY.1561.001
    - NI.SCENE.LANDJUWEEL.VAN_GHISTELE.1561.001
    - NI.SCENE.LANDJUWEEL.VAN_HAECHT_CENSORSHIP.1561.001
    - NI.SCENE.LANDJUWEEL.FATHER_RAPPROCHEMENT.1561.001
    relationship_movement: REL.CLAES.CORNELIS
    authoring_inputs: [WORLD.ANTWERP]
    refinement: NI.REFINEMENT.LANDJUWEEL_1561.CONTINUITY
    guardrails:
    - "No Silvius direct meeting in the 1561 chapter; direct Silvius/Dee formation begins in 1563."
    - "No alchemical teaching, secret initiation or Freemasonic gathering is created by the Landjuweel."
    - "The current Meirbrug/Onze-Lieve-Vrouwe procession segment remains under OPEN.LANDJUWEEL.ENTRY_ROUTE.1561.001 rather than being promoted to verified history."

  - id: H05
    story_time: {earliest: '1563-02-01', latest_exclusive: '1564-10-04', precision: bounded}
    label: "Dee/Silvius/Boom — process becomes power"
    cause: "Beginning in 1563, Claes learns through print, materials, graphite, pyritic matter, vitriol and the death/opening problem of Sol."
    effect: "He becomes a causal actor and begins to overvalue complete understanding as a route to control."
    instances: [NI.SCENE.DEE_FIRST_ENCOUNTER.1563.001, NI.SCENE.MEMORIAAL_GIFT.1564.001, NI.EVENT.SECURITY_BREAK.1564.001]
    arcs_advanced: [ARC.CLAES.DEE, ARC.CLAES.MACRO_TRANSMUTATION]
    guardrail: "Do not back-project direct Silvius formation into the 1561 Landjuweel visit."

  - id: H06
    story_time: {earliest: '1566-08-01', latest_exclusive: '1570-01-01', precision: bounded}
    label: "Return to Goes — old place, altered meanings"
    cause: "Claes returns after years of formation into a city whose religious, family and material order is no longer the childhood world."
    effect: "The place that should confirm identity instead exposes discontinuity; Mayken enters as a materially grounded equal rather than as a recovered piece of childhood."
    instances: [NI.EVENT.CLAES_RETURN_GOES.1566.001]
    relationship_projection: REL.CLAES.MAYKEN.CONJUNCTIO

  - id: H07
    story_time: {earliest: '1567-09-01', latest_exclusive: '1569-11-20', precision: bounded}
    label: "Cornelis — warning, secrecy and irreversible inheritance"
    cause: "Network exposure and repression convert Cornelis' protective secrecy into arrest, recidive pressure and public execution."
    effect: "Claes loses the possibility of repairing father-son time and inherits responsibility without receiving a cryptographic answer."
    instances: [NI.EVENT.CORNELIS_FALL.1568.001]
    arcs_advanced: [ARC.CLAES.CORNELIS, ARC.CLAES.LIFE]

  - id: H08
    story_time: {earliest: '1570-01-01', latest_exclusive: '1571-01-01', precision: year}
    label: "Memoriaal reveal — truth becomes obligation"
    cause: "A material cue plus controlled green-vitriol development reveals readable testimony already present."
    effect: "The problem changes from 'what is hidden?' to 'what must we do with what can now be read?'; Mayken's independent material judgement prevents solitary certainty."
    instances: [NI.SEQUENCE.RECOVERY.1570.001]
    arcs_advanced: [ARC.CLAES.LIFE, ARC.CLAES.MACRO_TRANSMUTATION, ARC.MAYKEN.LIFE]

  - id: H09
    story_time: {earliest: '1572-01-01', latest_exclusive: '1580-01-01', precision: design-window}
    label: "Zeeland second severance — siege, Reimerswaal, Satisfactie and economic/confessional afterlife"
    status: PARTLY_FIXED_PARTLY_OPEN
    cause: "War and settlement repeatedly transform Claes' two formative Zeeland cities and the routes between them."
    fixed_subanchors:
    - "1572: Claes physically goes to / is present in the Goes siege environment; exact side and role remain OPEN.CLAES.GOES.SIEGE_ROLE.1572.001."
    - "1573: from a boat Claes witnesses Zeeuwse/Geuzen forces burning Reimerswaal; exact vessel/route context remains OPEN.CLAES.REIMERSWAAL.BOAT_CONTEXT.1573.001."
    - "22 March 1577: Claes knows the Satisfactie of Goes and understands its relevant religious-political terms; presence/influence remains OPEN.CLAES.SATISFACTIE.ROLE_STRATEGY.1577.001."
    - "1577–1579: property/debt/legal afterlife remains an active part of the severance."
    effect: "Home, school-city, allegiance, confession and property cease to align into one recoverable identity. Claes must confront that both royalist and rebel systems can destroy, and that political transition can occur through negotiated continuity rather than immediate conquest."
    open_projection: ARC.CLAES.GOES_DEPARTURE_1572_1579
    context_projection: ARC.CLAES.ZEELAND_ROUTE.1572_1578
    decision_id: OPEN.GOES.CLAES_DEPARTURE_1572_1579.001
    guardrails:
    - "Do not fill the economic gap by destroying the documented Nissepad brewery or by labeling ordinary transfers confiscations."
    - "Do not collapse Reimerswaal's 1573 burning with the January 1574 naval battle."
    - "Do not turn the historical Satisfactie into a documented anti-Catholic trap."

  - id: H09A
    story_time: {earliest: '1577-09-01', latest_exclusive: '1578-01-01', precision: bounded}
    label: "Information becomes public power — Don Juan intercept/print context"
    status: CONTEXT_WITH_OPEN_TOUCHPOINT
    cause: "Intercepted Spanish correspondence is interpreted, framed and printed through the Marnix/Silvius/Van den Rade/Plantin/Vulcanius production chain."
    effect: "Claes' world contains a concrete model of private dangerous information becoming reproducible political action; direct Claes contact remains open."
    context_projection: ARC.CLAES.INFORMATION_EPISTEMOLOGY.1564_1584
    decision_id: OPEN.CLAES.DONJUAN_PRINT_TOUCHPOINT.1577.001

  - id: H10
    story_time: {earliest: '1578-01-01', latest_exclusive: '1579-01-01', precision: year}
    label: "Projectio of the Word"
    cause: "Claes chooses to move testimony out of private possession into print after years in which he has learned that publication multiplies framing and consequence as well as words."
    effect: "The textual mission is completed by release; public interpretation can no longer be controlled by Claes."
    instances: [NI.EVENT.PUBLICATION.1578.001]
    arcs_advanced: [ARC.CLAES.MACRO_TRANSMUTATION, ARC.CLAES.INFORMATION_EPISTEMOLOGY.1564_1584]

  - id: H10A
    story_time: {earliest: '1582-03-01', latest_exclusive: '1582-05-01', precision: bounded}
    label: "Jaureguy — retrospective legibility"
    status: CONTEXT_WITH_OPEN_TOUCHPOINT
    cause: "After the assassination attempt, objects, papers, finance, handwriting and testimony are assembled into a network explanation."
    effect: "Claes can learn that a pattern reconstructed after violence is not proof that the violence was predictable beforehand."
    context_projection: ARC.CLAES.INFORMATION_EPISTEMOLOGY.1564_1584
    decision_id: OPEN.CLAES.JAUREGUY_TOUCHPOINT.1582.001

  - id: H11
    story_time: {earliest: '1584-01-01', latest_exclusive: '1585-01-01', precision: year}
    label: "Delft — moral Nigredo / Albedo threshold: seeing is not knowing"
    cause: "Gerards' plausible cover and the assassination expose the limits of rightness, foreknowledge, close observation and control."
    effect: "Claes must distinguish truth from certainty and right action from guaranteed outcome. If the prior-sighting option is chosen, he remembers Gerards accurately without having been able to know what the observations meant."
    instances: [NI.CHAPTER.1584.01]
    arcs_advanced: [ARC.CLAES.LIFE, ARC.CLAES.MACRO_TRANSMUTATION, ARC.CLAES.INFORMATION_EPISTEMOLOGY.1564_1584]
    decision_id: OPEN.CLAES.GERARDS_PRIOR_SIGHTING.1584.001
    guardrail: "Claes must not become the fictional detective who almost prevents the historical assassination."

  - id: H12
    story_time: {earliest: '1584-01-01', latest_exclusive: '1602-03-14', precision: developmental}
    label: "Mayken and the late road — conjunctio as recovery in relation"
    cause: "Claes' analytical competence survives while embodied openness is constricted; Mayken's independent material mode continually contradicts disembodied certainty."
    effect: "Sinne returns as resonance: perception, body, memory, relation and moral choice can coexist."
    arcs_advanced: [ARC.CLAES.SINNE_RECOVERY, ARC.MAYKEN.LIFE]
    relationship_projection: REL.CLAES.MAYKEN.CONJUNCTIO

  - id: H13
    story_time: {date: '1602-03-13', precision: day}
    label: "Enkhuizen — Projectio of Matter"
    cause: "The late Sol/Rode-Leeuw line reaches a materially witnessed test under the Morhof-framed Seton event."
    effect: "The deeper test is whether Claes can understand material success without converting it into ownership, proof of self or total control."
    arcs_advanced: [ARC.CLAES.MACRO_TRANSMUTATION, ARC.CLAES.GREAT_WORK.AUTHORIAL]

  - id: H14
    story_time: {earliest: '1602-03-13', precision: open-ended}
    label: "Status Prima Nova — Projectio of Self"
    cause: "Word and Matter have both passed beyond private possession."
    effect: "Claes can perceive, distinguish, choose, carry and release without demanding that the world become safe, certain or owned."
    arcs_advanced: [ARC.CLAES.GREAT_WORK.AUTHORIAL]

  chapter_projection_rule:
  - "Every future chapter should identify which hinge it serves or justify why a new hinge is necessary."
  - "A chapter may activate multiple Corpus/Anima/Spiritus registers but must still have ordinary human causality."
  - "World detail from Round B is selected because it creates pressure, choice, contrast or consequence — not because research exists."
  - "Mayken's presence invokes ARC.MAYKEN.LIFE as well as the Claes relationship; she never exists only inside Claes' arc."
  - "H09 is now partly fixed: siege presence, Reimerswaal witness and Satisfactie knowledge are canon; the exact economic/departure chain and Claes' Satisfactie role remain visibly open."
  - "Information-war context may alter pressure, suspicion and interpretation without granting Claes direct meetings or omniscient knowledge."
