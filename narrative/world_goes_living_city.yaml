schema_version: 1.4.0
kind: WorldModuleRegistry
modules:
- id: WORLD.GOES_LIVING_CITY
  label: "Goes als levende stad — 1542–1579"
  canon_status: PROPOSED
  record_role: RESEARCH_AND_SCENE_BLOCKING_FRAMEWORK
  historical_method: TIME_SLICED_TOPOLOGICAL_AND_TOPOGRAPHIC_RECONSTRUCTION
  location_anchor: ENT.LOC.GOES
  supported_by:
  - SC.HIST.GOES.NISSEPAT.NOORDEINDE_1534.001
  - SC.HIST.GOES.NISSEPAT.NISSEPAD_1540.001
  - SC.HIST.GOES.NISSEPAT.NIEUWSTRAAT_1542.001
  - SC.HIST.GOES.NIEUWSTRAAT.PRE1594.001
  - SC.HIST.GOES.STADSSCHOOL.LOCATION_1558.001
  - SC.HIST.GOES.SALT.WESTZELKE_1543_1544.001
  - SC.HIST.GOES.SALT.NORTH_HARBOUR_1554.001
  - SC.HIST.GOES.FIRE_1554.FOOTPRINT.001
  - SC.HIST.GOES.FIRE_1554.SPREAD.001
  - SC.MODEL.GOES.FIRE_1554.FIREBRANDS.001
  - SC.HIST.GOES.FIRE_1554.CASUALTIES.001
  - SC.HIST.GOES.NIEUWSTRAAT.BURNED_HOUSES_1556.001
  - SC.HIST.GOES.FIRE_1554.NIEUWSTRAAT_PARTIAL_DAMAGE.001
  - SC.HIST.GOES.BREWERY.NISSEPAD_1577.001
  - SC.HIST.GOES.WESTZELKE.BURNT_SALTPAN_1577.001
  - SC.HIST.GOES.SIEGE_1572.INDUSTRY.001
  - SC.HIST.GOES.REDERIJKERS.NARDUSBLOEM_ZUSTERHUIS.001
  - SC.HIST.GOES.ZUSTERHUIS.SINGELSTRAAT.001
  - SC.HIST.GOES.REDERIJKERS.FOUR_CHAMBERS.001
  - SC.HIST.GOES_GROTE_KERK.BUILD.001
  - SC.HIST.GOES_GROTE_KERK.INTERIOR.001

  purpose:
    primary: "Answer scene questions spatially and socially: who/what is where, which streets and gates connect them, what a route passes, and what changes after fire, siege and confessional transition."
    atlas_relation: "The Storybible stores semantic/time/evidence relations; the Stadsatlas stores dense parcel geometry and routing. Neither replaces the other."

  spatial_reasoning_contract:
    relations_are_distinct: [OWNS, SELLS, BUYS, RESIDES, RENTS, OPERATES_BUSINESS, WORKS_AT, ADJOINS, USES, VISITS]
    residence_rule: "Never infer RESIDES from OWNS, ADJOINS or OPERATES_BUSINESS. Cornelis/young Claes have one explicit exception because DEC.CORNELIS.RESIDENCE.GOES.2026-08-14 creates the RESIDES relation to the 1542 house."
    parcel_rule: "A transport chain is not automatically one simultaneous physical parcel. Use the year slider and physical-place/slot inference before depicting multiple houses."
    boundary_rule: "Four belendingen support topology, side-of-street and neighbourhood sequence, not exact cadastral shape."
    modern_map_rule: "Modern street names may anchor durable geometry but do not prove identical sixteenth-century names or micro-traces."

  core_anchors:
    civic_religious:
    - {location: ENT.LOC.GOES.GROTE_MARKT, function: market_and_civic_focus}
    - {location: ENT.LOC.GOES_GROTE_KERK, function: catholic_church_until_1578_then_confessional_transition}
    - {location: ENT.LOC.GOES.SCHUTTERSHOF_STADSSCHOOL, function: city_school_anchor_attested_1558}
    - {location: ENT.LOC.GOES.ZUSTERHUIS, function: cornelis_era_rhetorician_meeting_environment}
    commerce_industry:
    - {location: ENT.LOC.GOES.HAVEN, function: shipping_trade_supply_and_market_access}
    - {location: ENT.LOC.GOES.WESTZELKE, function: north_harbour_salt_industry_and_harbour_edge}
    - {location: ENT.LOC.GOES.OOSTZELKE, function: north_harbour_salt_industry_and_1554_fire_origin_zone}
    - {location: ENT.LOC.GOES.TURFKADE, function: trade_street_and_1554_confirmed_damage_area}
    movement:
    - {location: ENT.LOC.GOES.GANZEPOORT, function: southern_city_threshold}
    - {location: ENT.LOC.GOES.VOORSTAD, function: built_approach_outside_southern_gate}
    - {location: ENT.LOC.GOES.NISSEPAD_CORRIDOR, function: southern_rural_business_and_family_property_corridor}
    - {location: ENT.LOC.GOES.SHEER_HENDRIKSKINDERENPOORT, function: western_gateway_and_1572_pressure_point}
    - {location: ENT.LOC.GOES.HAVENPOORT, function: harbour_gateway_and_1572_pressure_point}

  street_and_place_identity_rules:
    pre1594_nieuwstraat:
      entity: ENT.LOC.GOES.NIEUWSTRAAT_PRE1594
      status: RESOLVED_ZONE_LEVEL
      decision: DEC.GOES.NIEUWSTRAAT.IDENTITY.2026-08-14
      rule: "Use an older Nieuwstraat/Oude Nieuwstraat in or by the Armenhoek for pre-1594 acts. The historical toponym is certain, the Armenhoek zone is supported, and the exact 1542 street axis remains unknown."
      evidence_hook: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      parcel_topology: "1542 Nissepat house: street east; Jacob Dierixsen de Bye north, west and south; therefore house is on the west side of the historical street."
      fire_state: "Post-fire deeds document burned houses at the corner of Nieuwstraat and in Armenhoek, while ordinary houses also survive/transfer. Treat the micro-area as mixed partial damage, not a safe zone and not total destruction."
    planned_nieuwstraat:
      entity: ENT.LOC.GOES.NIEUWSTRAAT_1594
      status: PROPOSED_HISTORICAL_ANCHOR
      rule: "Only active as the planmatige/current Nieuwstraat from the 1594 expansion decision; never use it for the 1542 Nissepat house."

  nissepat_property_network:
    canonical_story_grandfather:
      person: ENT.PERSON.CLAES_JACOBSZ_NISSEPAT
      historical_property_events:
      - {year: 1534, relation: SELLS, property: ENT.PROP.GOES.NISSEPAT.NOORDEINDE_1534}
      - {year: 1540, relation: SELLS, property: ENT.PROP.GOES.NISSEPAT.NISSEPAD_1540, note: "seller remained east neighbour, so adjoining property remained in his hands at the act date"}
      - {year: 1542, relation: BUYS, property: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542}
      novel_genealogy: "fictional father of Cornelis and paternal grandfather of Claes under DEC.CLAES.GRANDFATHER_LINK.2026-08-14"
      historical_guardrail: "The genealogy is not proven by the transport registers."
      1554_story_state: "loses the 1542 house as a property asset and helps Cornelis sustain Claes' education afterward"
    later_family_nodes:
    - {person: ENT.PERSON.CLAES_PIERSEN_NISSEPAT, zone: ENT.LOC.GOES.NOORDEINDE, year: 1568, relation: BUYS_AND_SELLS}
    - {person: ENT.PERSON.JAN_JANSEN_NISSEPAT, zone: ENT.LOC.GOES.WESTZELKE, year: 1577, relation: SELLS_BURNED_SALT_SITE}
    - {person: ENT.PERSON.JAN_JANSEN_NISSEPAT, zone: ENT.LOC.GOES.VISMARKT, year: 1579, relation: PROPERTY_NETWORK}
    - {person: ENT.PERSON.JAN_PAUWELSEN_NISSEPAT, zone: ENT.LOC.GOES.NISSEPAD_CORRIDOR, year: 1577, relation: ADJOINS_BREWERY}
    fiction_guardrail: "Do not turn other documented Nissepat nodes into one proven nuclear family without a separate genealogical decision."

  cornelis_and_household:
    person: ENT.PERSON.CORNELIS
    fixed:
    - "Cornelis is a Goes poorter and biersteker; he is not the brewery owner or printer."
    - "The family home during Claes' Goes childhood is ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542 under DEC.CORNELIS.RESIDENCE.GOES.2026-08-14."
    - "Historical Claes Jacobsz. Nissepat bought that house; the paternal genealogy and household use are novel canon."
    - "Immediately before the fire the household contains Cornelis, Tanneken, Claes, younger brother Jan and an unborn child; Tanneken is about six months pregnant."
    canonical_residence: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
    residence_decision: DEC.CORNELIS.RESIDENCE.GOES.2026-08-14
    business_separation: "Nissepad, harbour, brewery, salt and storage locations remain separate relations unless separately linked."
    fire_outcome_1554: DEC.CLAES.FAMILY_FIRE.1554.2026-08-14
    fire_outcome_note: "In novel canon the house is destroyed/uninhabitable; Tanneken, Jan and the unborn child die; Claes and Cornelis survive away from the house. This is fiction grounded in a historically supported partially damaged street environment."
    post_fire_father_son: DEC.CLAES.POSTFIRE_FATHER_SON.2026-08-14
    post_fire_note: "Cornelis stays in Goes to rebuild livelihood/business/shelter and pay for Claes' education; Claes goes to Reimerswaal, so surviving father and son grieve apart."
    rhetorician_meeting_environment: ENT.LOC.GOES.ZUSTERHUIS
    rhetorician_decision: DEC.GOES.REDERIJKERS.MEETINGPLACE.2026-08-14
    chamber_identity: ENT.ORG.GOES.NARDUSBLOEM
    chamber_decision: DEC.CORNELIS.REDERIJKER.NARDUS_CASTANIE_ORIGIN.2026-08-16
    castanien_relation: "In novel canon Cornelis has a formative role in the reform-minded/protestantiserende 1560s current that later becomes the Edele Castanienbloem; 1595 remains the earliest surviving attestation, not a proved founding date."
    deken_status: OPEN.CORNELIS.REDERIJKER.DEKEN.001

  fire_1554_reconstruction:
    refinement_module: WORLD.GOES.FIRE_1554.REFINEMENT
    historical_core:
      date: '1554-05-18'
      salt_industry_position: "north of the walled city along the harbour"
      harbour_keten_inventory: 81
      inventory_guardrail: "81 is the cited harbour-zone inventory, not the number proven destroyed"
      origin: ENT.LOC.GOES.OOSTZELKE
      wind: "strong north-easterly; destructive transport broadly west/south-west"
      spread_shape: "multi-front brandwaaier/spotting is physically plausible; exact ignition timing is unknown"
      casualty_count: UNKNOWN
    current_story_boundary:
      home: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      historical_parcel_damage: UNKNOWN
      novel_canon: "destroyed/uninhabitable"
      fictional_casualties: [ENT.PERSON.CLAES_MOTHER, ENT.PERSON.CLAES_BROTHER, ENT.PERSON.CLAES_UNBORN_SIBLING]
      survivors: [ENT.PERSON.CLAES, ENT.PERSON.CORNELIS]
      decision: DEC.CLAES.FAMILY_FIRE.1554.2026-08-14

  route_templates:
    child_to_church:
      status: ORIGIN_RESOLVED_ROUTE_TO_QUERY
      origin: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      destination: ENT.LOC.GOES_GROTE_KERK
      instruction: "Use the year-valid atlas route from the older Nieuwstraat/Armenhoek home to the church and return streets/landmarks with certainty labels; do not invent an exact old-street axis where the atlas cannot resolve it."
    home_to_rhetoricians:
      status: ORIGINS_RESOLVED_ROUTE_TO_QUERY
      origin: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      destination: ENT.LOC.GOES.ZUSTERHUIS
      instruction: "Use the year-valid atlas route. Cornelis' canonical chamber affiliation is Nardusbloem; do not reopen the old generic chamber-identity question."
    south_to_city:
      status: usable_framework
      sequence: [ENT.LOC.GOES.NISSEPAD_CORRIDOR, ENT.LOC.GOES.KARNEMELKSEPUT, ENT.LOC.GOES.VOORSTAD, ENT.LOC.GOES.GANZEPOORT, ENT.LOC.GOES.GROTE_MARKT]
      note: "The Nissepad proper begins beyond the Karnemelkseput in the route reconstruction; do not label every southern approach segment Nissepad."
    market_harbour:
      status: source_weighted
      sequence: [ENT.LOC.GOES.GROTE_MARKT, ENT.LOC.GOES.VISMARKT, ENT.LOC.GOES.HAVEN]

  city_population_layer:
    source: SRC-HIST-GOES-LIVING-CITY-001
    rule: "Use transport parties and named belenders as a year- and location-filtered social backdrop. A person named as buyer/seller/belender may be present in the property network but is not automatically resident at that parcel."
    examples_from_1530s_1550s:
    - "wagenmakers occur in property transactions behind the dorp and outside the Gansepoort"
    - "smiths/smeden occur at Westzelke and near urban access points"
    - "a scheepstimmerman appears as Westzelke neighbour, fitting the harbour-industrial environment"
    - "bakers/bakkers occur as named neighbours in the dense urban fabric"
    - "a mesmaker occurs at Zuideinde"
    - "a priest and an organist are parties to the 1558 house by the city school"
    scene_use: "Populate a route with only the occupations/names attested in the relevant period or with generic historically plausible people clearly not presented as named historical residents."

  time_slices:
    '1542':
      city_state: "walled late-medieval trading town centred on market, church and harbour; salt industry at harbour edges; active southern/western gate approaches"
      church: "pre-Reformation Catholic interior"
      school: "city schooling exists, but the 1558 Schuttershof location must not be back-projected as certain without further evidence"
      nissepat: "On 20 March historical Claes Jacobsz. Nissepat buys the older-Nieuwstraat house; in novel canon he is Cornelis' father and makes it the family home. Claes is born later that year."
      residence: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      rhetorician_environment: ENT.LOC.GOES.ZUSTERHUIS
    '1554_pre_fire':
      city_state: "same core street/harbour system immediately before the 18 May fire; salt-work complex north of the walls along the harbour"
      salt_industry: "Oostzelke/Westzelke harbour-industrial edges; 81 keten in the cited inventory, individual placement partly schematic"
      household_home: ENT.PROP.GOES.NISSEPAT.NIEUWSTRAAT_1542
      household: ENT.FAMILY.CORNELIS_HOUSEHOLD_1554
      family_state: "Cornelis + Tanneken + Claes + Jan + unborn child"
    '1554_fire':
      origin_zone: ENT.LOC.GOES.OOSTZELKE
      wind: "north-east toward west/south-west"
      spread: "source-weighted multi-front harbour-to-city corridor; exact minute-by-minute sequence unknown"
      historical_casualty_count: UNKNOWN
      household_story: "house destroyed/uninhabitable; Tanneken, Jan and unborn child die; Claes and Cornelis survive away"
    '1554_post_fire':
      destroyed_or_confirmed_damage: [ENT.LOC.GOES.TURFKADE, ENT.LOC.GOES.KRUISBROEDERS]
      origin_zone: ENT.LOC.GOES.OOSTZELKE
      broad_damage: "harbour plus northern/western Goes; watermill also reported burned"
      nieuwstraat_microfootprint: "mixed/partial damage supported: burned houses documented in Nieuwstraat/Armenhoek, while ordinary houses also survive/transfer"
      family_home_specific_state: "NOVEL_CANON_DESTROYED_OR_UNINHABITABLE"
      family_casualties_story: [ENT.PERSON.CLAES_MOTHER, ENT.PERSON.CLAES_BROTHER, ENT.PERSON.CLAES_UNBORN_SIBLING]
      survivors_story: [ENT.PERSON.CLAES, ENT.PERSON.CORNELIS]
      grandfather_loss_story: "Claes Jacobsz. loses the house as his property asset"
      historical_guardrail: "No current chain proves that a documented burned parcel is the 1542 Nissepat house and no victim list proves the fictional family deaths."
      narrative_function: "1554 destroys the family as a household; Reimerswaal then separates the two survivors geographically while Cornelis stays in Goes to rebuild and finance Claes' future."
    '1572':
      siege_pressure: [ENT.LOC.GOES.SHEER_HENDRIKSKINDERENPOORT, ENT.LOC.GOES.HAVENPOORT]
      destroyed_industry: ["outside salt works", ENT.PROP.GOES.VOORSTAD.BREWERY_1572]
      distinction: "1572 military burning is separate from 1554 accidental/urban fire"
    '1577_1579':
      city_state: "post-siege legal and property reorganisation; Satisfactie is a political/religious governance layer, not itself a physical rebuilding date"
      nissepat_examples: [ENT.PROP.GOES.WESTZELKE.GEMEEN_KEETGE, ENT.PROP.GOES.NISSEPAD.BREWERY_1577]
      legal_guardrail: "sales are not called executions/confiscations unless the act proves that procedure"

  institutions:
    rhetoricians:
      umbrella: ENT.ORG.GOES.REDERIJKERS
      historically_documented_meeting_sequence:
      - {organization: ENT.ORG.GOES.NARDUSBLOEM, location: ENT.LOC.GOES.ZUSTERHUIS, through: 1626}
      - {organization: ENT.ORG.GOES.NARDUSBLOEM, location: ENT.LOC.GOES.SEBASTIAANSHOF, from: 1626}
      cornelis_scene_location: ENT.LOC.GOES.ZUSTERHUIS
      cornelis_scene_decision: DEC.GOES.REDERIJKERS.MEETINGPLACE.2026-08-14
      cornelis_chamber: ENT.ORG.GOES.NARDUSBLOEM
      cornelis_chamber_decision: DEC.CORNELIS.REDERIJKER.NARDUS_CASTANIE_ORIGIN.2026-08-16
      castanien_origin: ENT.ORG.GOES.CASTANIENBLOEM
      deken_status: OPEN.CORNELIS.REDERIJKER.DEKEN.001
      rule: "Do not generalize the Nardusbloem Zusterhuis evidence into a claim that every Goese chamber necessarily used the same room."
      guardrail: "The Maria Magdalena devotional relation, the Zusterhuis worldly meeting environment and the post-1626 Sint-Sebastiaanshof are three distinct relations and times."

  scene_query_protocol:
    steps:
    - "Resolve scene year."
    - "Resolve character relation to place: RESIDES/OWNS/WORKS/OPERATES/VISITS."
    - "Apply explicit 14- and 16-August decisions before generic inference: residence, old Nieuwstraat identity, family-fire outcome, Zusterhuis meeting environment and Cornelis' Nardusbloem affiliation."
    - "Query year-valid street/gate/landmark anchors."
    - "Query transport-register people/occupations on the route or immediate blocks."
    - "Apply event footprint for 1554, 1572, 1578 or later urban changes."
    - "For 1554 distinguish historical geography, source-supported damage, qualitative firebrand model and explicit fictional family outcome."
    - "Return route plus named anchors, source certainty and unresolved gaps."
    required_answer_shape: "where + route + what is passed + who plausibly appears + what changed since previous time slice + certainty labels"

  guardrails:
  - "Goes must not be rendered as empty geometry: use the register population layer, markets, craft, harbour traffic, church rhythms, gates and changing damage states."
  - "Do not use the modern/planned Nieuwstraat of 1594 as the location of the 1542 Nissepat house."
  - "Do not invent the exact 1542 axis of the older Nieuwstraat beyond the supported Armenhoek zone and deed topology."
  - "Cornelis' family home is canonically resolved, but residence remains distinct from occupation and business properties."
  - "Do not conflate the 1572 burned Voorstad brewery with the documented 1577 Nissepad brewery."
  - "Do not place the 1554 salt-work origin south of the city: the source-weighted salt complex lies north of the walls along the harbour."
  - "Do not convert the figure of 81 harbour keten into 81 burned keten."
  - "Do not invent a historical 1554 casualty count; the present evidence bundle records it as UNKNOWN."
  - "The 1542 house is destroyed/uninhabitable in novel canon, but that specific parcel loss is not a historical claim."
  - "Tanneken, Jan and the unborn child are fictional fire casualties; never present them as names recovered from a historical victim record."
  - "The Claes Jacobsz. → Cornelis → Claes genealogy is novel canon using a historical person; it is not proven by the transport registers."
  - "Do not reopen Cornelis' generic chamber identity: Nardusbloem is canon; only deken status remains open."
  - "Do not back-project the Nardusbloem's post-1626 Sint-Sebastiaanshof meeting place into Cornelis' period."
