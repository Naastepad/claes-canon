schema_version: "1.0.0"
kind: EconomicStateResolver
id: RESOLVER.ECONOMY.CLAES.1542_1602
status: AUTHORING_ACTIVE
purpose: >-
  Resolve historically bounded economic scene context from date, place, political control,
  actor role and transaction type. This resolver supplies world conditions only. It never
  creates a Story Claim, fictional transaction, ownership relation, confiscation, debt,
  departure cause or chapter event by itself.

authority_boundary:
  evidence_registry: claims/SOURCE_CLAIMS_ECONOMY_2026-08-30.yaml
  local_baseline: storybible/domains/GOES_ECONOMIC_BASELINE_1542_1572.md
  war_modifier: storybible/domains/WAR_ECONOMY_1567_1602.md
  open_story_hinge: OPEN.GOES.CLAES_DEPARTURE_1572_1579.001
  rules:
    - "canon/ and current Story Claims outrank this resolver."
    - "Historical evidence does not create fictional participation."
    - "An OPEN authorial decision remains open unless explicitly resolved in canon/."
    - "Resolve political control before applying any war-tax or rebel-money rule."

input_contract:
  required:
    - story_date
    - location
  recommended:
    - political_control
    - actor_role
    - transaction_type
    - commodity
    - chapter_ref
  optional:
    - siege_state
    - route_origin
    - route_destination
    - amount
    - named_coin
    - named_measure

output_contract:
  fields:
    - baseline_state
    - war_state
    - political_control_state
    - accounting_units
    - plausible_coin_rules
    - local_measures
    - price_anchors
    - wage_anchors
    - taxes_and_dues
    - trade_permissions
    - supply_disruption
    - confiscation_or_seizure_risk
    - source_grade
    - unresolved_data
    - forbidden_inferences

resolution_order:
  - step: 1
    action: resolve_date_place
  - step: 2
    action: resolve_political_control
    hard_gate: true
  - step: 3
    action: apply_local_baseline
  - step: 4
    action: apply_war_modifier
  - step: 5
    action: apply_actor_transaction_filter
  - step: 6
    action: apply_coin_measure_date_filter
  - step: 7
    action: attach_evidence_grade_and_open_gaps

source_priority:
  - rank: 1
    grade: A_DIRECT
    definition: "same place + same/specific date + matching commodity/service/institution"
  - rank: 2
    grade: B_LOCAL_SERIES
    definition: "same place, relevant local series/institution, date interpolation or bounded continuity"
  - rank: 3
    grade: C_REGIONAL_PROXY
    definition: "nearby/economically comparable place with explicit proxy label"
  - rank: 4
    grade: D_CONTEXT_ONLY
    definition: "broader Low Countries/Holland/Brabant context; order-of-magnitude or mechanism only"
  - rule: "Never silently promote C or D to a local factual value."

baseline_states:
  - id: ECON.BASE.GOES.1542_1572
    world_module: WORLD.GOES_ECONOMY_1542_1572
    location_match: [Goes, Zuid-Beveland]
    date_window: {earliest: "1542-01-01", latest_exclusive: "1572-01-01"}
    accounting_units:
      - "pond Vlaams / schelling / groot where source/context supports"
      - "carolusgulden = 20 stuivers as accounting relation"
    local_measure_rules:
      grain:
        relation: "1 Goese viertel/sack = 2 achtendelen"
        conversion_rule: "source/date-sensitive; ca. 36.6-40.1 L per achtendeel in consulted sixteenth-century comparisons"
        evidence: [SC.HIST.GOES.GRAIN_MEASURE.ACHTENDEEL.1572.001, SC.HIST.GOES.GRAIN_MEASURE.SOURCE_VARIATION.1590.001]
      beer:
        institutional_antecedent: "official biermeter / measurement-before-sale documented before Claes' lifetime"
        exact_claes_period_tariff: OPEN_RESEARCH
        evidence: [SC.HIST.GOES.BEER.MEASUREMENT_ANTECEDENT.001]
      salt:
        piecework_1546: "4 groten per man for defined hundred-grof-zout handling task by seven men"
        classification: PIECE_RATE_NOT_DAY_WAGE
        evidence: [SC.HIST.GOES.SALT.LABOUR_PIECE_RATE.1546.001]
    coin_rules:
      - {from: "1543-01-01", item: "silver Carolusgulden", rate: "20 stuivers", evidence: SC.HIST.COIN.CAROLUS.ACCOUNTING.1521_1543.001}
      - {from: "1557-01-01", item: "Philipsdaalder", rate: "30 stuivers at introduction", evidence: SC.HIST.COIN.PHILIPSDAALDER.RATES.1557_1580.001}
      - {from: "1559-01-01", item: "Philipsdaalder", rate: "35 stuivers", evidence: SC.HIST.COIN.PHILIPSDAALDER.RATES.1557_1580.001}
    unresolved_data:
      - "Goese civilian day-wage series ca. 1540-1602 not yet extracted from municipal accounts."
      - "Exact 1540s-1560s Goese beer-measure tariff/ordinance wording."
    forbidden_inferences:
      - "accounted gulden -> physical Carolus coin"
      - "1546 salt piece rate -> daily wage"
      - "1595 rye price -> youth-period rye price"
      - "Cornelis biersteker -> brewer"

  - id: ECON.BASE.GOES.LATE_REFERENCE.1594_1602
    location_match: [Goes, Zuid-Beveland]
    date_window: {earliest: "1594-01-01", latest_exclusive: "1603-01-01"}
    direct_anchor:
      rye_1595:
        historical_value: "170 groten Vlaams per Goese sack"
        derived_value: "85 stuivers = 4 gulden 5 stuivers"
        evidence: SC.HIST.GOES.RYE_PRICE.1595.001
    broader_price_series:
      status: AVAILABLE_BUT_REQUIRES_UNIT_PROVENANCE_AUDIT
      evidence: SC.HIST.IISG.NL_PRICE_SERIES.1594_1602.001

war_states:
  - id: ECON.WAR.W1.REPRESSION_1567_1569
    date_window: {earliest: "1567-01-01", latest_exclusive: "1570-01-01"}
    applies_when: "Habsburg/royal repression context relevant to place/actor"
    effects:
      confiscation_or_seizure_risk: ELEVATED_CONTEXT_ONLY
      credit_network_risk: ELEVATED
      military_burden_context: POSSIBLE
    military_pay_context:
      nominal_royal_infantry: "4-5 stuivers/day"
      evidence: SC.HIST.MILITARY.ROYAL_INFANTRY_PAY.1567_1600.001
    forbidden_inferences:
      - "elevated confiscation risk -> a named Nissepat property was confiscated"
      - "nominal soldier pay -> actual timely cash payment"

  - id: ECON.WAR.W2.ALVA_TAX_CRISIS_1569_1572
    date_window: {earliest: "1569-03-20", latest_exclusive: "1572-04-01"}
    policy:
      hundredth: "1% one-time possession levy"
      twentieth: "5% sale of immovables"
      tenth: "10% sale of movables"
      export: "additional 10% proposed"
      evidence: SC.HIST.ALVA.TAX_PROJECT.1569.001
    implementation_mode: THREAT_NEGOTIATION_LOCAL_IMPLEMENTATION_REQUIRED
    evidence_boundary: SC.HIST.ALVA.TAX_IMPLEMENTATION_BOUNDARY.1569_1572.001
    authoring_signals: [plakkaat, calculation, afkoop_negotiation, collector_apparatus, merchant_uncertainty, resistance]
    forbidden_inferences:
      - "proposal date -> universal payment"
      - "movable sale -> automatically proven 10% paid in a scene"

  - id: ECON.WAR.W3.DIVIDED_ZEELAND_1572_1576
    date_window: {earliest: "1572-04-01", latest_exclusive: "1577-01-01"}
    jurisdiction_evidence: SC.HIST.ZEELAND.POLITICAL_CONTROL.DIVIDED_1572_1576.001
    control_rules:
      Goes_Zuid_Beveland:
        political_control: LANDSHEERLIJK
        rule: "Do not apply rebel-Zeeland fiscal/coin interventions by province shortcut."
      rebel_Zeeland:
        political_control: GEMENE_ZAAK_REBEL
        licentrecht:
          from: "1573"
          evidence: SC.HIST.ZEELAND.REBEL.LICENT_CONVOY.1573_1576.001
        convoygeld:
          from: "1576"
          evidence: SC.HIST.ZEELAND.REBEL.LICENT_CONVOY.1573_1576.001
        beer_ammunition_levy:
          from: "1574-05-01"
          amount: "4 stuivers per ton"
          liable: [domestic_brewer_production, beer_imported_from_outside_Holland_Zeeland]
          evidence: SC.HIST.ZEELAND.REBEL.BEER_AMMUNITION_LEVY.1574.001
        coin_countermark:
          window: "1573-1574"
          precision: LOCAL_CHRONOLOGY_LIMITED
          evidence: SC.HIST.COIN.KLOP.ZEELAND_REBEL.1573_1574.001
    siege_override_rule: "Emergency money only if a supported named city issue exists."
    emergency_money_evidence: SC.HIST.NOODMONEY.SIEGE_SPECIFIC.1570S.001
    forbidden_inferences:
      - "Zeeland 1574 -> one fiscal regime"
      - "Goes 1574 -> rebel beer levy"
      - "Goes 1573 -> rebel klop"
      - "war -> emergency money"

  - id: ECON.WAR.W4.SETTLEMENT_1577_1579
    date_window: {earliest: "1577-01-01", latest_exclusive: "1580-01-01"}
    effects: [debt_arrears, supplier_customer_claims, property_legal_afterlife, inheritance_settlement, rebuilding_cost, delayed_payment, network_recomposition]
    authorial_status: MECHANISM_PALETTE_ONLY
    open_decision: OPEN.GOES.CLAES_DEPARTURE_1572_1579.001
    forbidden_inferences:
      - "ordinary transfer -> confiscation"
      - "1572 burned Voorstad brewery -> documented 1577 Nissepad brewery"
      - "documented Nissepad brewery -> Cornelis property"
      - "economic mechanism -> resolved departure cause"

  - id: ECON.WAR.W5.PROVINCIAL_MONEY_1579_1585
    date_window: {earliest: "1579-01-01", latest_exclusive: "1586-01-01"}
    effects: [changing_coin_rates, mixed_coin_pool, provincial_monetary_rules, continuing_war_trade_boundaries]
    known_rate_anchor:
      item: Philipsdaalder
      rate: "45 stuivers in 1579/1580 according to Boonman"
      evidence: SC.HIST.COIN.PHILIPSDAALDER.RATES.1557_1580.001
    unresolved_data:
      - "Exact city/route-specific coin pool must be sourced before enumerating purse contents."

  - id: ECON.WAR.W6.NORTH_TRANSFORMATION_1585_1593
    date_window: {earliest: "1585-01-01", latest_exclusive: "1594-01-01"}
    effects: [altered_trade_routes, migration_capital_skills, military_demand, prolonged_war_cost, price_wage_change]
    evidence_precision: CONTEXT_UNTIL_LOCAL_SERIES_ATTACHED
    forbidden_inferences:
      - "later Golden Age war-profit pattern -> specific Claes-period contract"

  - id: ECON.WAR.W7.LATE_PRICE_WINDOW_1594_1602
    date_window: {earliest: "1594-01-01", latest_exclusive: "1603-01-01"}
    price_series:
      evidence: SC.HIST.IISG.NL_PRICE_SERIES.1594_1602.001
      status: AUDIT_REQUIRED_BEFORE_NUMERIC_USE
      required_metadata: [file, year, place_scope, commodity, unit, currency, provenance, transformation_status]

actor_transaction_filters:
  - id: FILTER.CORNELIS.BIERSTEKER
    actor_role_match: [biersteker, beer_distributor, beer_merchant]
    apply:
      allowed_actions: [order_negotiate, receive_casks, inspect_condition_quantity, record, store, arrange_transport, deliver_sell, settle_credit]
      prohibited_auto_actions: [brew, formulate_recipe, own_Nissepad_brewery, personally_liable_as_brewer_for_production_tax]
    canon_basis: [DEC.NISSEPAT.BREWERY.FAMILY_NETWORK.2026-08-16, DEC.CORNELIS.BEER.DISTRIBUTION_CHAIN.2026-08-16]

  - id: FILTER.COIN.NAMED
    when_input: named_coin
    apply:
      required_resolution: [date, political_zone, rated_value, physical_coin_vs_accounting_reference]
    forbidden_inference: "coin name -> fixed value"

  - id: FILTER.MEASURE.NAMED
    when_input: named_measure
    apply:
      required_resolution: [place, date, commodity, historical_relation, conversion_source]
    forbidden_inference: "same measure name -> same litres everywhere"

  - id: FILTER.CONFISCATION
    when_input: confiscation_or_seizure
    apply:
      required_resolution: [authority, legal_basis_or_story_decision, specific_asset, date, evidence]
    fallback_output: "risk/context only"

chapter_context_map:
  - chapters: [CH.DE_DREMPEL.1547, CH.DE_LEI.1552, CH.HET_WAPEN.1553, CH.DE_KRAAI.1553, CH.DE_KRAAN.1553, CH.DE_WEGEN.1553, CH.HET_ZAND.1554, CH.HET_GIST.1554, CH.DE_WINNAAR.1554, CH.HET_ZAAD.1554, CH.DE_KAMER.1554, CH.DE_WIEG.1554]
    location: Goes
    baseline_state: ECON.BASE.GOES.1542_1572
    war_state: null
    note: "Economic detail remains subordinate to each chapter's dramatic function."

  - chapters: [CH.DE_LADINGEN.1564, CH.DE_VERKEERDE_KIST.1564, CH.DE_KIES_VAN_BOOM.1564, CH.DE_LOOG.1564, CH.DE_DOOD_VAN_SOL.1564]
    location: Antwerp_or_route_as_chapter_specific
    baseline_state: USE_WORLD_ANTWERP_AND_TRANSACTION_SOURCE
    war_state: null
    note: "Do not import Goese measures/prices into Antwerp merely because Claes knows them."

  - chapters: [CH.DE_MARKT_VAN_DELFT.1584]
    location: Delft
    baseline_state: LOCAL_HOLLAND_BASELINE_REQUIRED
    war_state: ECON.WAR.W5.PROVINCIAL_MONEY_1579_1585
    note: "Exact Delft purse/prices require Holland/Delft sources; W5 provides only the war-money modifier."

hinge_context_map:
  - hinge: H01
    economic_context: [ECON.BASE.GOES.1542_1572]
  - hinge: H02
    economic_context: [ECON.BASE.GOES.1542_1572]
    modifier: "catastrophic local loss must be derived from fixed fire canon, not inferred by resolver"
  - hinge: H03
    economic_context: [REIMERSWAAL_LOCAL_BASELINE_REQUIRED]
  - hinge: H04
    economic_context: [ANTWERP_1561_COMMERCIAL_BASELINE_REQUIRED]
  - hinge: H05
    economic_context: [ANTWERP_1563_1564_LOGISTICS_BASELINE_REQUIRED]
  - hinge: H06
    economic_context: [ECON.BASE.GOES.1542_1572, ECON.WAR.W1.REPRESSION_1567_1569]
  - hinge: H07
    economic_context: [ECON.WAR.W1.REPRESSION_1567_1569]
  - hinge: H08
    economic_context: [ECON.WAR.W2.ALVA_TAX_CRISIS_1569_1572]
  - hinge: H09
    economic_context: [ECON.WAR.W3.DIVIDED_ZEELAND_1572_1576, ECON.WAR.W4.SETTLEMENT_1577_1579]
    open_decision: OPEN.GOES.CLAES_DEPARTURE_1572_1579.001
  - hinge: H10
    economic_context: [ECON.WAR.W4.SETTLEMENT_1577_1579, ANTWERP_1578_LOCAL_BASELINE_REQUIRED]
  - hinge: H11
    economic_context: [ECON.WAR.W5.PROVINCIAL_MONEY_1579_1585]
  - hinge: H12
    economic_context: [ECON.WAR.W5.PROVINCIAL_MONEY_1579_1585, ECON.WAR.W6.NORTH_TRANSFORMATION_1585_1593, ECON.WAR.W7.LATE_PRICE_WINDOW_1594_1602]
  - hinge: H13
    economic_context: [ECON.WAR.W7.LATE_PRICE_WINDOW_1594_1602, ENKHUIZEN_1602_LOCAL_BASELINE_REQUIRED]

known_numeric_gaps:
  - id: GAP.ECON.GOES.WAGES.1540_1602
    priority: HIGH
    need: "Extract Goese civilian wage observations from municipal account series cited in published wage research."
    rule_until_resolved: "No regional proxy may be relabelled as a Goese wage."
  - id: GAP.ECON.GOES.BEER_TARIFFS.1542_1569
    priority: MEDIUM
    need: "Verify exact Claes-period biermeter/meetgeld ordinances and tariff continuity."
  - id: GAP.ECON.LOCAL_BASELINES.POST1572
    priority: MEDIUM
    need: "Add Delft/Holland, late Zeeland and Enkhuizen local price/coin layers before exact scene calculations."

final_guardrail: >-
  This resolver may say what economic conditions are plausible or evidenced in a scene.
  It may not say that an event happened to Claes merely because the economic mechanism existed.
