schema_version: 1.2.0
kind: NarrativeRelationshipRegistry
relationships:
  - id: REL.CLAES.CORNELIS
    type: Relationship
    label: "Claes and Cornelis"
    participants: [ENT.PERSON.CLAES, ENT.PERSON.CORNELIS]
    status: CANON
    phases:
      - label: "formation"
        story_time: {earliest: 1547-01-01, latest_exclusive: 1554-05-18, precision: approximate}
        value_state: "dependence -> admiration"
        function: "Cornelis teaches attention, craft, patience and the difference between pieces and routes."
      - label: "distance through secrecy"
        story_time: {earliest: 1560-01-01, latest_exclusive: 1564-10-04, precision: interval}
        value_state: "admiration -> suspicion/exclusion"
        function: "Claes sees that Cornelis hides not only from authorities but also from him."
      - label: "fallback asymmetry"
        story_time: {earliest: 1564-10-04, latest_exclusive: 1568-07-01, precision: bounded}
        value_state: "father protects son through ignorance while using him as fallback"
        knowledge_boundary: "Cornelis knows Claes is fallback; Claes does not."
      - label: "loss and inheritance"
        story_time: {earliest: 1568-07-01, latest_exclusive: 1570-01-01, precision: work-window}
        value_state: "living authority -> absent moral inheritance"
        transfer: "Castanea. Niet onze bloem — de boom."
      - label: "differentiation"
        story_time: {earliest: 1570-01-01, precision: lower-bound}
        value_state: "inheritance -> independent moral judgement"
    ko_targets: [KO.CHARACTER, KO.VALUE, KO.CONFLICT, KO.RELATIONSHIP]

