  - id: REL.CLAES.BELOVED
    type: Relationship
    label: "Claes and Mayken"
    participants: [ENT.PERSON.CLAES, ENT.PERSON.BELOVED]
    status: CANON
    decision_ids: [DEC.CLAES.MAYKEN.2026-08-23, DEC.MAYKEN.REPUTATION_FALL.1578.2026-08-23]
    phases:
      - label: "early recognition"
        story_time: {earliest: 1554-01-01, latest_exclusive: 1566-08-01, precision: broad-window}
        value_state: "childhood acquaintance/material curiosity -> remembered independent person"
        function: "Early manuscript contact establishes Mayken before she becomes the adult counterpart; do not retroactively turn every childhood moment into romance."
      - label: "material proximity"
        story_time: {earliest: 1566-08-01, latest_exclusive: 1570-01-01, precision: bounded}
        value_state: "separate expertise -> practical complementarity and growing trust"
        object: OBJ.DODOENS_CARRIER
      - label: "recovery collaboration"
        story_time: {earliest: 1570-01-01, latest_exclusive: 1571-01-01, precision: year}
        value_state: "solitary pattern-seeking -> collaborative verification"
        narrative_instances: [NI.SEQUENCE.RECOVERY.1570.001]
      - label: "danger and public rereading"
        story_time: {earliest: 1578-01-01, latest_exclusive: 1579-01-01, precision: year}
        value_state: "private/professional trust -> joint action under social danger"
        narrative_instances: [NI.SEQUENCE.MAYKEN_REPUTATION.1578.001, NI.EVENT.FLIGHT_GOUDA.1578.001]
        function: "Claes must choose before certainty; Mayken remains a co-actor rather than cargo to be rescued."
      - label: "northern companionship"
        story_time: {earliest: 1578-01-01, latest_exclusive: 1603-01-01, precision: broad-window}
        value_state: "shared flight -> trust, contradiction, love without possession and sensory/spiritual companionship"
        narrative_instances: [NI.SEQUENCE.NORTH_ROUTE.1584_1602.001]
      - label: "late material witness"
        story_time: {earliest: 1584-07-15, latest_exclusive: 1602-01-01, precision: open-window}
        value_state: "collaborative expertise -> possible witness/knower of Claes' own ambiguous transmutation"
        function: "Exact presence or knowledge remains open; Mayken does not certify the event for the reader."
    role_split:
      claes: ["merels", "Dee-memory", "Monas", "Castanea-memory", "clear-text decisions", "final responsibility"]
      mayken: ["materials", "botany", "materia medica", "Dodoens loci", "lists", "error control", "contradiction", "independent care decisions"]
    guardrails:
      - "No rape as the mechanism that starts the northern route."
      - "No dissociative-identity / multiple-personalities construction."
      - "No required formal Goese witch trial."
      - "Mayken's expertise and agency cannot collapse into serving Claes' arc."
    ko_targets: [KO.RELATIONSHIP, KO.CONFLICT, KO.VALUE, KO.CHARACTER]

