schema_version: 2.0.0
kind: RevealArchitectureRegistry
id: REVEAL.MEMORIAAL.CLAES.1570
canon_status: CANON
source_decision: DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15
purpose: "Formal representation of the direct chemical reveal architecture. The Brevísima is concealed by material state, not cryptographic transformation: readable text is invisibly printed before binding and becomes readable when green vitriol develops the tannin print."

physical_carrier:
  object: OBJ.MEMORIAAL
  payload: OBJ.LASCASAS_PLAINTEXT
  production_time: "before Dee gives the memoriaal to Claes and before Boom, early 1564"
  production_order: [set-readable-translation, invisible-tannin-gum-print-on-loose-sheets, dry, fold-gather, bind]
  claes_initial_knowledge: "ordinary pedagogical memoriaal; graphite-only rule; no awareness of hidden payload"
  security_break_effect: "4 October 1564 changes surrounding political/network risk, not the book's physical content or access mechanism"

reveal_chain:
  - step: R1
    id: REVEAL.STEP.MATERIAL_CUE
    possible_input: OBJ.ZOVITIUS_1570_TRIGGER
    output: "GALLA LEO VIRIDIS"
    meaning: "personal/material cue linking gall/tannin to green vitriol; not a key"
  - step: R2
    id: REVEAL.STEP.VITRIOL
    input: "green vitriol"
    prerequisite: "memoriaal available + suitable material handling"
    effect: "iron supplied by green vitriol complexes with the tannin/gallnut layer in the hidden typographic letterforms"
  - step: R3
    id: REVEAL.STEP.MEMORIAAL_TEXT
    input: OBJ.MEMORIAAL
    output: OBJ.LASCASAS_PLAINTEXT
    effect: "the already printed Diets/Brabant Brevísima becomes visible in ordinary readable type"
    guardrail: "reveal is reading, not decryption"

graphite_layer:
  object: OBJ.GRAPHITE_STIFT
  function: "Claes may write, draw and correct on the same pages while preserving the iron-free hidden tannin layer during his pupil phase"
  visible_before_reveal: true
  cryptographic_function: none

retired_architecture:
  id: CODE.RECOVERY.CLAES.1570
  canon_status: DEPRECATED
  reason: "The cipher was introduced only because whole-book invisible printing initially appeared impracticable. Once the tannin/gum movable-type process became the accepted story technology, cryptographic recovery became redundant overengineering."
  retired_components:
    - OBJ.LASCASAS_CIPHERTEXT
    - OBJ.DIRECT_KEY
    - OBJ.MERELS_24 as recovery key
    - OBJ.MONAS_CLAES as ordering key
    - OBJ.CASTANEA as key anchor
    - OBJ.DODOENS_CARRIER as nomenclator carrier
    - OBJ.PRIMUS_INDEX
    - 24x24 matrix
    - nine-table nomenclator
    - multi-week plaintext reconstruction
  preservation_rule: "Merels, Monas, Dodoens, Castanea or related motifs/objects may survive elsewhere only where they have an independent narrative or historical function; they are not required to reveal the Brevísima."

hard_guardrails:
  - "The completed Diets/Brabant readable translation exists before the hidden print run."
  - "Silvius sets readable language, not ciphertext, for Claes' memoriaal sheets."
  - "The readable translation is invisibly printed and bound before Boom in early 1564."
  - "Claes may possess the hidden readable text without knowing that it exists."
  - "Dee's graphite-only rule protects the tannin-loaded pages; Claes knows the rule but not the hidden reason."
  - "No cipher, nomenclator, matrix or key-recovery sequence is necessary for access to the hidden Brevísima."
  - "Green vitriol reveals readable text directly."
  - "4 October 1564 does not load, recipher or lock/unlock the memoriaal."
  - "The tannin/gum print process remains a historically disciplined technical reconstruction pending OPEN.MATERIAL.WET_TEST.001."
  - "1578 publication provenance remains novel canon rather than historical fact."

lemma_candidates:
  - rule_family: can_reveal_plaintext
    prerequisites: ["memoriaal_available", "vitriol_available"]
  - rule_family: actor_can_possess_required_object
  - rule_family: actor_can_know_required_knowledge
