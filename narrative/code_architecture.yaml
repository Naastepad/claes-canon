  - step: 3
    id: CODE.STEP.MEMORIAAL_REVEAL
    input: OBJ.MEMORIAAL
    output: OBJ.MERELS_24
    effect: "hidden recto layer becomes readable"
  - step: 4
    id: CODE.STEP.MERELS
    input: OBJ.MERELS_24
    output: "theorem permutation I-XXIV"
    checksum: "I through XXIV exactly once"
  - step: 5
    id: CODE.STEP.MONAS
    input: OBJ.MONAS_CLAES
    output: "row and column permutations"
    function: "ordering"
  - step: 6
    id: CODE.STEP.MATRIX
    input: "24 problem-order notae + 24 theorem-order notae"
    output: "24 x 24 matrix"
    combinations: 576
  - step: 7
    id: CODE.STEP.CASTANEA
    input: OBJ.CASTANEA
    output: "entry into special Dodoens carrier"
    function: "wayfinding/authentication"
  - step: 8
    id: CODE.STEP.DODOENS
    input: OBJ.DODOENS_CARRIER
    output: "nine-table third dimension"
    tables: [C, N, H, F, P, L, D, O, S]
    nomenclator_values: 5184
  - step: 9
    id: CODE.STEP.PRIMUS_INDEX
    input: OBJ.PRIMUS_INDEX
    output: "identity: Bartolome de Las Casas / destruction of the Indies / Diets-Brabant translation"
    narrative_time_to_identity_minutes: {min: 30, max: 60}
  - step: 10
    id: CODE.STEP.FULL_DECODE
    input: [OBJ.LASCASAS_CIPHERTEXT, OBJ.DODOENS_CARRIER]
    output: OBJ.LASCASAS_PLAINTEXT
    work_duration_days: {min: 35, max: 56}
    work_hours_estimate: {min: 172, max: 256}

