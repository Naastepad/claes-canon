  - id: NI.SEQUENCE.CORNELIS_REEXPOSURE.ANTWERP.1568_1569.001
    type: SequenceInstance
    label: Hernieuwde blootstelling via clandestiene papieren en boekvisitatie
    canon_status: CANON
    story_time:
      earliest: '1568-09-01'
      latest_exclusive: '1569-11-19'
