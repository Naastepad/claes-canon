    story_claims: [STC.CORNELIS.DEATH.ANTWERP.1569.001, STC.CORNELIS.CARRIER_NOT_PRINTER.001]
    function: Move Cornelis from warned/borged route-person to recidive/seditious network suspect whose silence can plausibly become fatal.
    required_sequence_logic:
      - Simple book possession is insufficient.
      - The second exposure must involve seditious network framing, renewed contact or transport evidence, and refusal to name others.
      - The March 1569 book visitation supplies the documented pressure environment, not a documented Cornelis record.
  - id: NI.SCENE.CORNELIS_EXECUTION.ANTWERP.1569.001
    type: SceneInstance
    label: Claes getuigt van Cornelis' executie in Antwerpen
    canon_status: CANON
    story_time:
      date: '1569-11-19'
      precision: day
    locations: [ENT.LOC.ANTWERP]
    entities: [ENT.PERSON.CLAES, ENT.PERSON.CORNELIS]
    story_claims: [STC.CORNELIS.EXECUTION_WITNESS.001, STC.CORNELIS.DEATH.ANTWERP.1569.001, STC.CORNELIS.SILENCE_THIRD_SCRIPT.001]
    function: Cornelis' public execution becomes Claes' decisive father-loss and moral inheritance; it resolves the father as vulnerable carrier, not protected printer, and clarifies why testimony may need to survive indirectly.
    sublocations_text:
      - Het Steen as detention-route context
      - Grote Markt / market book-burning environment as preferred public setting
    required_scene_logic:
      - Claes is physically present in the crowd.
      - Cornelis has previously been detained or examined in Antwerp and is linked to book/paper traffic by renewed exposure.
      - The formal story charge concerns seditious network complicity, forbidden papers/books/liederen/prints/correspondence, recidive after earlier borg/conditions, and refusal to name others.
      - Simple book smuggling alone is insufficient.
      - Cornelis' death must not depend on him carrying OBJ.MEMORIAAL.
      - No cryptographic key or Castanea clue is required at the execution.
      - Any final exchange should serve relationship, testimony or protective silence rather than puzzle mechanics.
      - The scene contrasts Catholic ars moriendi, Protestant martyr display and Cornelis' protective silence.
      - Do not claim Haecht documents Cornelis.
    value_shift:
      opening: hope_that_father_can_still_be_recovered_or_explained
      turn: Cornelis refuses the names and does not enter either available death-script cleanly
      closing: father_lost_as_body_but_inherited_as_unresolved_moral_burden
