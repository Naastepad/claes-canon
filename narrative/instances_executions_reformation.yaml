    story_claims: [STC.CORNELIS.FIRST_ARREST_BAIL.1567.001, STC.CORNELIS.CARRIER_NOT_PRINTER.001]
    function: Show that Cornelis is compromised and watched, but that the first exposure is not yet a historically convincing immediate death sentence.
    required_scene_logic:
      - First arrest or examination concerns papers, routes, carriers, storage or book-world contacts.
      - Release happens through borg, conditions, lack of complete proof or usefulness as a traceable route.
