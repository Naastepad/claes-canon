  type: MotifExtension
  label: Sinne as recovery motif
  status: CANON
  parent: MOTIF.SINNE
  sequence:
  - sensory openness
  - vigilance
  - blunting/constriction
  - rediscovery
  - inward resonance
  - embodied discernment
  - wisdom
  - release
  relationship: REL.CLAES.BELOVED
