schema_version: 1.3.0
kind: ObjectRegistry
objects:
- id: OBJ.MEMORIAAL
  label: Claes’ memoriaalboek
  type: BookObject
  canon_status: CANON
  historical_status: FICTIONAL_OBJECT
  decision_ids:
  - DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15
  - DEC.MEMORIAAL.FORMAT_17Q.2026-08-15
  phases:
  - phase: hidden-print-production
    window: {earliest: '1564-01-01', latest_exclusive: '1564-04-01', precision: interval}
    function: loose sheets carry the completed Diets/Brabant Brevísima in ordinary readable type as a near-invisible tannin/gallnut + gum-arabic typographic layer before binding
    production:
      order: [set-readable-translation, print-recto-verso, dry, fold-gather, bind]
      format:
        gathering_mode: single-sheet quarto
        full_sheets: 17
        printed_leaves: 68
        latent_pages: 136
        binder_endleaves: genuinely blank and additional to the 68 printed leaves
        imposition_first_forme: [1, 4, 5, 8]
        imposition_wederdruk: [2, 3, 6, 7]
        sequence_control: fold each completed sheet promptly and keep order by temporary external workshop wrappers/strips rather than relying on visible black signatures in Claes' finished book
        reference_analogue: 1578 Brabant/Dutch Seer cort Verhael facsimile, used for capacity and text sequence only
        supersedes_provisional_estimate: 18 sheets / 72 leaves / 144 pages
      text_body:
        begins_with: Las Casas prologue to Prince Philip
        excludes: [later-visible-edition-title-page, separate-translator-address]
        sheet_A_content_reference: facsimile PDF pages 12-19; prologue through beginning of Cort verhael and first general destruction/gold-motive passages
        exact_line_breaks: OPEN_UNTIL_DEFINITIVE_1564_CAST_OFF
      typography:
        mode: austere readable small book type
        excludes: [commercial-title-page, printer-mark, privilege, place-date-imprint, decorative-woodcut-ornaments, large-decorated-initials-as-default]
        objective: physically unobtrusive latent text with usable white space for Claes' graphite notes
      first_pass_medium: clear filtered gallnut/tannin extract + gum arabic
      excludes: [green-vitriol, iron-salt, soot, visible-pigment]
      workshop_starting_recipe:
        gallnuts: 2 medicinal drachmen
        steeping_water: 2.5 medicinal ounces
        retained_clear_extract: 2 medicinal ounces
        gum_arabic: 1.5 medicinal ounces
        adjustment: small additions of gum or clear water by behaviour on type
      proof_developer: 0.5 medicinal drachme green vitriol in 4 medicinal ounces clear water
      historical_status: AUTHORIAL_TECHNICAL_RECONSTRUCTION_WET_TEST_OPEN
  - phase: pedagogical-hidden-carrier
    window: {earliest: '1564-01-01', latest_exclusive: '1570-01-01', precision: bounded}
    function: apparently blank workbook given by Dee before Boom; simultaneously already carries OBJ.LASCASAS_PLAINTEXT without Claes knowing it
    writing_rule: graphite only while Claes remains Dee's pupil; no ink
    paired_object: OBJ.GRAPHITE_STIFT
  - phase: security-break-unchanged-object
    earliest: '1564-10-04'
    function: 4 October changes the surrounding political/network risk but does not alter, load, recipher or key the memoriaal
  - phase: revealed
    window: {earliest: '1570-01-01', latest_exclusive: '1571-01-01', precision: year}
    function: controlled green-vitriol development makes the hidden printed readable Brevísima visible directly
  hidden_structure:
    carrier: OBJ.LASCASAS_PLAINTEXT
    physical_form: translated Brevísima printed in ordinary readable type on 17 single-sheet quarto gatherings before binding
    visible_before_activation: apparently blank/usable writing paper, with only any later graphite notes visible
    cryptographic_layer: none
  constraints:
  - hidden Brevísima load exists before Dee gives the book to Claes and before the journey to Boom
  - Claes genuinely does not know the hidden function or Las Casas content during Dee formation
  - ordinary iron-gall ink is forbidden while Claes remains Dee's pupil
  - green vitriol reveals the hidden readable text directly
  - 4 October 1564 does not insert, recipher or add a key architecture to the hidden text
  - chemical steganography is the concealment mechanism; no nomenclator or decryption layer is required
  - hidden printed body is 17 full quarto sheets = 68 printed leaves = 136 latent pages, excluding genuinely blank binder-added endleaves
  - the 1578 facsimile anchors capacity and sequence only and is not evidence that the fictional 1564 hidden edition historically existed
  deterministic_domains: [possession, knowledge, reveal]

- id: OBJ.GRAPHITE_STIFT
  label: Dee’s grafietstift voor Claes
  type: WritingTool
  canon_status: CANON
  historical_status: STORY_OBJECT_HISTORICAL_FORM_AND_PROVENANCE_OPEN
  decision_ids:
  - DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15
  phases:
  - phase: gift-before-Boom
    window: {earliest: '1564-01-01', latest_exclusive: '1564-04-01', precision: interval}
    holder: ENT.PERSON.CLAES
    giver: ENT.PERSON.JOHN_DEE
    paired_object: OBJ.MEMORIAAL
  functions:
  - permits dry marking, notation and diagram work in the memoriaal without ordinary iron-gall ink
  - enforces Dee's pedagogical/material-security rule during Claes' pupil phase
  constraints:
  - represent as a graphite marking stift/stylus, not automatically as a modern wood-cased pencil
  - exact historical material form and route by which Dee has it in Antwerp in 1564 remain open for verification
  - it is not a cipher key
  deterministic_domains: [possession, use]

- id: OBJ.MONAS_CLAES
  label: Claes’ exemplaar van Monas Hieroglyphica
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_WORK_FICTIONAL_COPY_HISTORY
  year: 1564
  phases:
  - phase: formation-object
    earliest: '1564-01-01'
  constraints:
  - Monas may remain part of Dee's formation, symbolism and Claes' intellectual development
  - it is not required to reveal or decode the hidden Brevísima
  - the former 24-permutation cipher function is deprecated by DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15

- id: OBJ.ZOVITIUS_SCHOOLBOOK
  label: Watergetekend Zovitius-schoolboek
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_WORK_FICTIONAL_COPY_HISTORY
  phases:
  - phase: Reimerswaal-study
    window: {earliest: '1554-05-19', latest_exclusive: '1561-09-01', precision: bounded}
    function: education and marginal practice
  - phase: water-damaged
    window: {earliest: '1555-01-01', latest_exclusive: '1556-01-01', precision: year}
    condition: band/edges distorted; text remains complete
  - phase: annotated
    function: teacher corrections plus Claes' observations on language, usability and merels
  - phase: Silvius-recognition
    function: evidence of lived pedagogy, not discovery of an unknown text
  constraints:
  - not same object as OBJ.ZOVITIUS_1570_TRIGGER
  - Zovitius himself cannot meet Claes; his historical trace ends before Claes' birth

- id: OBJ.ZOVITIUS_1570_TRIGGER
  label: Bijzonder Zovitius-exemplaar 1570
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_EDITION_FICTIONAL_MARKINGS
  functions:
  - can reactivate Claes' Dee-memory through GALLA LEO VIRIDIS
  - points toward the material relation gall/tannin + green vitriol
  constraints:
  - distinct from schoolbook
  - trigger/cue only, never a cryptographic key
  - the direct-readable Brevísima does not require nomenclator recovery

- id: OBJ.DODOENS_CARRIER
  label: Bijzonder Dodoens-exemplaar / carrier
  type: BookObject
  canon_status: DEPRECATED
  historical_status: HISTORICAL_WORK_FICTIONAL_CARRIER_PROVENANCE
  version: Dodoens-carrier v2.9
  former_functions:
  - nomenclator values
  - nine botanical table identities
  - Castanea wayfinding
  note: The special coded Dodoens carrier is retired with the cipher architecture. Dodoens may still appear as an ordinary historical botanical work where independently useful.

- id: OBJ.LASCASAS_PLAINTEXT
  label: Voltooide Dietse/Brabantse Las-Casas-vertaling
  type: TextObject
  canon_status: CANON
  historical_status: FICTIONAL_EARLY_PROVENANCE
  decision_ids:
  - DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15
  - DEC.MEMORIAAL.FORMAT_17Q.2026-08-15
  phases:
  - phase: completed-translation-before-hidden-print
  - phase: arrives-in-Antwerp-via-wrong-chest
  - phase: set-in-ordinary-readable-type-and-printed-invisibly-on-memoriaal-sheets
  - phase: revealed-directly-by-green-vitriol-in-1570
  - phase: prepared-for-safe-onward-transmission
  - phase: led-toward-anonymous-1578-publication-in-novel-canon
  constraints:
  - historical 1578 publication is real; Claes provenance is fictional
  - no cipher transformation separates the hidden printed text from the readable translation
  - the hidden 1564 carrier begins with Las Casas' prologue to Prince Philip and excludes the later visible-edition title page and separate translator's address
  - capacity/sequence are anchored to the 136-page Las Casas body observed in the 1578 Brabant/Dutch facsimile, without treating that witness as proof of a 1564 edition

- id: OBJ.LASCASAS_CIPHERTEXT
  label: FINAL CIPHER-1564
  type: CipherText
  canon_status: DEPRECATED
  historical_status: FICTIONAL_DEVELOPMENT_ARTIFACT
  version: v2.7
  former_metrics:
    words: 30930
    distinct_word_forms: 5172
    groups: 35584
    groups_per_word_average: 1.150
    nomenclator_values: 5184
    used_code_values: 4181
    spelling_subword_segments: 1671
    phrase_segments: 3371
    round_trip_verified: true
  superseded_by: OBJ.LASCASAS_PLAINTEXT
  note: Retained as audit history. The cipher was a workaround for the earlier assumption that a whole readable text could not be hidden typographically; the tannin/gum print process removes that need.

- id: OBJ.DIRECT_KEY
  label: Oorspronkelijke directe sleutel
  type: KeyObject
  canon_status: DEPRECATED
  form_status: RETIRED_WITH_CIPHER
  note: No direct key is required for a readable text concealed chemically.

- id: OBJ.MERELS_24
  label: 24 merelsproblemen
  type: PuzzleSet
  canon_status: DEPRECATED
  historical_status: HISTORICAL_PROBLEM_TRADITION_FICTIONAL_RECOVERY_USE
  count: 24
  note: The specific 24-problem recovery object is retired with the cipher architecture. Merels as game, training and motif remains available through its independent scenes and motifs.

- id: OBJ.CASTANEA
  label: Castanea-anker
  type: KeyAnchor
  canon_status: DEPRECATED
  historical_status: FICTIONAL_MARKING_ON_HISTORICAL_WORK
  former_functions: [wayfinding, authentication, personal-memory-bridge]
  former_memory_anchor: "Castanea. Niet onze bloem — de boom."
  note: The key-anchor function is retired with the cipher architecture; botanical or symbolic Castanea use may be reconsidered independently.

- id: OBJ.PRIMUS_INDEX
  label: Primus Index
  type: IndexObject
  canon_status: DEPRECATED
  historical_status: FICTIONAL
  former_functions: [rapid-identity-reveal]
  note: No identity index is required because the developed memoriaal reveals readable Brevísima text directly.