schema_version: 1.2.0
kind: ObjectRegistry
objects:
- id: OBJ.MEMORIAAL
  label: Claes’ memoriaalboek
  type: BookObject
  canon_status: CANON
  historical_status: FICTIONAL_OBJECT
  phases:
  - phase: pedagogical
    window: {earliest: '1564-01-01', latest_exclusive: '1564-04-01', precision: interval}
    function: ordinary-looking workbook given by Dee before Boom
  - phase: recovery-carrier
    earliest: '1564-10-04'
    function: blind carrier containing 24 problem rectos + 2 key rectos
    hidden_structure:
      problem_rectos: 24
      key_rectos: 2
      hidden_layer: tannin/galnut layer on rectos only
      visible_before_activation: red corner marks and limited registration puncta
  - phase: activated
    window: {earliest: '1570-01-01', latest_exclusive: '1571-01-01', precision: year}
    function: green-vitriol development makes hidden diagrams/text readable
  constraints:
  - secret load occurs after 1564-10-04
  - Claes genuinely does not know hidden function at insertion
  - vitriol reveals the memoriaal, not Las Casas directly
  - memoriaal supplies merels/theorem/Monas bridge, not Dodoens content values
  deterministic_domains: [possession, knowledge, decode]

- id: OBJ.MONAS_CLAES
  label: Claes’ exemplaar van Monas Hieroglyphica
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_WORK_FICTIONAL_MARGINALIA
  year: 1564
  phases:
  - phase: formation-object
    earliest: '1564-01-01'
  - phase: recovery-ordering-key
    earliest: '1570-01-01'
  features:
  - 24 fictional marginal notes
  - one permutation of L/S/C/A per theorem
  constraints:
  - all 24 permutations are used exactly once
  - Monas supplies ordering, not plaintext
  - fictional cipher use is not claimed as Dee's historical published intent

- id: OBJ.ZOVITIUS_SCHOOLBOOK
  label: Watergetekend Zovitius-schoolboek
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_WORK_FICTIONAL_COPY_HISTORY
  phases:
  - phase: Reimerswaal-study
    window: {earliest: '1554-05-19', latest_exclusive: '1561-09-01', precision: bounded}
    function: education and marginal practice
  - phase: water-damaged
    window: {earliest: '1555-01-01', latest_exclusive: '1556-01-01', precision: year}
    condition: band/edges distorted; text remains complete
  - phase: annotated
    function: teacher corrections plus Claes' observations on language, usability and merels
  - phase: Silvius-recognition
    function: evidence of lived pedagogy, not discovery of an unknown text
  constraints:
  - not same object as OBJ.ZOVITIUS_1570_TRIGGER
  - Zovitius himself cannot meet Claes; his historical trace ends before Claes' birth

- id: OBJ.ZOVITIUS_1570_TRIGGER
  label: Bijzonder Zovitius-exemplaar 1570
  type: BookObject
  canon_status: CANON
  historical_status: HISTORICAL_EDITION_FICTIONAL_MARKINGS
  functions:
  - activates recovery via GALLA LEO VIRIDIS
  - reactivates Claes' personal Dee-memory
  constraints:
  - distinct from schoolbook
  - trigger only, never the complete key

