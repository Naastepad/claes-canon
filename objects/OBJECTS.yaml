- id: OBJ.DIRECT_KEY
  label: Oorspronkelijke directe sleutel
  type: KeyObject
  canon_status: CANON
  form_status: OPEN
  components: [24-order, orientation, Castanea-anchor]
  constraints:
  - withheld or destroyed after safety breach
  - not handed to Cornelis once he becomes operationally too visible

- id: OBJ.MERELS_24
  label: 24 merelsproblemen
  type: PuzzleSet
  canon_status: CANON
  historical_status: HISTORICAL_PROBLEM_TRADITION_FICTIONAL_RECOVERY_USE
  count: 24
  internal_concordance: P1–P14 + P16–P25
  reader_rule: no P numbers in-world; 24 complete sheets
  output: permutation of theorem I–XXIV exactly once
  notation_grammar:
    shape: which locally distinguished stone
    letter: which problem-local relevant locus
    prose: when/how/under-which-response
  constraints:
  - P15 is research metadata, not an in-world missing puzzle
  - no fixed modern coordinate system in-world
  - local letters and local stone forms have problem-local meaning
  - pigment, party and shape remain independent information layers

- id: OBJ.CASTANEA
  label: Castanea-anker
  type: KeyAnchor
  canon_status: CANON
  historical_status: FICTIONAL_MARKING_ON_HISTORICAL_WORK
  functions: [wayfinding, authentication, personal-memory-bridge]
  memory_anchor: "Castanea. Niet onze bloem — de boom."
  constraints:
  - not fruit/leaf counting
  - no extra numeric layer

- id: OBJ.PRIMUS_INDEX
  label: Primus Index
