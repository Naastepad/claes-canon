  - first knowingly identifiable Familist encountered by Cornelis
  - social/religious bridge to Barrefelt
  guardrails:
  - Cornelis' meeting with Dens is novel canon, not a discovered historical record.

- id: ENT.HIST.PERSON.HENDRIK_JANSEN_BARREFELT
  type: HistoricalPersonAnchor
  label: Hendrik Jansen van Barrefelt
