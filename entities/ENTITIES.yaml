- id: ENT.PERSON.ALEXANDER_SETON
  type: Person
  label: Alexander Seton
  fictionality: historical
  canon_status: CANON
  aliases: [Alexander Sethon, Setonius, Sethonius, Cosmopolites]
  roles: [alchemist, travelling-adept, projectio-catalyst, late-mirror-for-Claes, test-of-release-beyond-possession]
  usage: historical actor incorporated exclusively into the late Enkhuizen 1602 alchemical climax under DEC.SETON.ENKHUIZEN_ALCHEMICAL_MIRROR.1602.2026-08-16
  historical_status:
    identity: uncertain
    origin: Scottish attribution in tradition; exact identity unresolved
    noble_seton_family_connection: unproven
    confession: unknown
    political_alignment: unknown
  constraints:
  - Do not displace John Dee as Claes' earlier principal scholar/mentor.
  - Do not give Seton a verified modern recipe for transmutation.
  - Do not state that Seton's historical Enkhuizen powder was green or red.
  - Do not state as fact that he belonged to the noble Seton family.
  - Do not state as fact that he was Protestant, anti-Spanish or a partisan of the Dutch Revolt.
  - Do not connect Seton to revealing, decoding, reading, authenticating, printing or recovering the Brevísima or memoriaal.
  - The Brevísima textual mission is already completed by the Antwerp 1578 print event.

- id: ENT.PERSON.JACOB_HANSSEN
  type: Person
