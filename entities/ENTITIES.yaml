  fictionality: historical_tradition
  canon_status: CANON
  aliases: [Jacob Haussen, Jacob Hausfsen, James Haussen]
  roles: [Enkhuizen-sailor-pilot, Seton-host, witness-in-transmutation-tradition]
  historical_anchor:
    '1601': shipwreck/rescue on Scottish coast in later tradition
    '1602-03-13': host/witness of Seton projection at Enkhuizen in Morhof-derived tradition
  story_use:
