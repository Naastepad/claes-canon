  decision_id: DEC.CORNELIS.BEER.DISTRIBUTION_CHAIN.2026-08-16
  route_model:
  - ENT.LOC.GOES.NISSEPAD_CORRIDOR
  - ENT.LOC.GOES.GANZEPOORT
  - ENT.LOC.GOES.VOORSTAD
  - urban storage / customers
  - ENT.LOC.GOES.HAVEN if onward shipping is scene-relevant
  guardrail: This is a functional corridor model, not proof of one invariant cart route or universal harbour passage.
