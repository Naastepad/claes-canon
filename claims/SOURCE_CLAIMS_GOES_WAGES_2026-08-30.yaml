schema_version: "1.0.0"
kind: SourceClaimRegistryExtension
claims:
  - id: SC.HIST.GOES.WAGES.PROVENANCE.DEVRIES.001
    type: SourceClaim
    statement: "Jan de Vries' labour-market chapter includes Goes among the western-Netherlands wage locations used for Tables 2a/2b and cites G.A. Goes, Rekeningen van de stad nos. 783-959 plus rekeningen stadsfabriek nos. 1813-14 and 1793-97 as the Goese archival basis."
    claim_type: historical_wage_series_provenance
    subject: "Goese civil/construction wage series"
    predicate: "archival provenance cited"
    object: "G.A. Goes city accounts 783-959; stadsfabriek accounts 1813-14 and 1793-97"
    evidence_status: VERIFIED
    source_ids: [SRC-SECONDARY-DEVRIES-LABOUR-MARKET-GOES-WAGES-001]
    verification:
      status: explicit_source_apparatus_in_consulted_full_text
      note: "This verifies De Vries' Goese provenance pointer only; it does not establish that these inventory ranges cover 1540-1602."

  - id: SC.HIST.GOES.WAGES.DEVRIES_COVERAGE_BOUNDARY.001
    type: SourceClaim
    statement: "De Vries' cited Goese inventory range cannot be assumed to be a Claes-period source series: an independent Zeeland education repertory cites GA Goes, Stad Goes, inv.nr. 784 for an event in 1627."
    claim_type: archival_coverage_boundary
    subject: "De Vries Goese wage-source inventory range"
    predicate: "Claes-period coverage"
    object: "not established; at least inv.nr. 784 is used for 1627 evidence"
    evidence_status: SUPPORTED
    source_ids: [SRC-SECONDARY-DEVRIES-LABOUR-MARKET-GOES-WAGES-001]
    verification:
      status: independent_inventory_number_date_crosscheck
      note: "Do not describe nos. 783-959 as a 1540-1602 wage series without a dated archive inventory mapping."

  - id: SC.HIST.GOES.WAGES.NUMERIC_GAP.001
    type: SourceClaim
    statement: "Exact Goese daily-wage observations for 1540-1602 remain unverified in the project. The accessible De Vries transcription does not expose a readable local Table 2 row, and the cited Goese inventory range is not yet shown to cover the Claes period."
    claim_type: evidence_boundary
    subject: "Goese daily wages 1540-1602"
    predicate: "numeric extraction status"
    object: "not yet recovered from a dated pre-1602 local source"
    evidence_status: UNKNOWN
    source_ids: [SRC-SECONDARY-DEVRIES-LABOUR-MARKET-GOES-WAGES-001]
    verification:
      status: explicit_project_gap_after_archive_coverage_check
      note: "The next target is a dated pre-1602 Goese account series or another direct local wage source, not interpolation from De Vries' later Goese material."

  - id: SC.HIST.GOES.LABOUR.MUNICIPAL_ADMIN_ROUTE.PRE1602.001
    type: SourceClaim
    statement: "The official Stad Goes archive description states that city finances were administered by annually elected rentmeesters from 1438 and that public property/works were supervised by stadsdirecteuren with a stadsfabriek for daily management."
    claim_type: archival_institutional_provenance
    subject: "Goese municipal labour-payment administration"
    predicate: "institutional source route"
    object: "rentmeester finance and public-works/stadsfabriek administration"
    evidence_status: VERIFIED
    source_ids: [SRC-ARCHIVE-GOES-STAD-001]
    verification:
      status: official_archive_description
      note: "This establishes where public expenditure was administered, not a continuous surviving wage series or a numeric wage."

  - id: SC.HIST.GOES.LABOUR.TIMMERGUILD_ACCOUNTS.1547_1798.001
    type: SourceClaim
    statement: "A historical inventory of the surviving Goese guild archives reports account books of the timmerliedengilde spanning 1547-1798 and resolutions spanning 1586-1798; the guild ordinance book covered timmerlieden, kuipers, stoeldraaiers, wannemakers, mandenmakers, wagenmakers and metselaars."
    claim_type: archival_source_survival
    subject: "Goese timmerliedengilde records"
    predicate: "surviving account/resolution coverage"
    object: "account books 1547-1798; resolutions 1586-1798"
    evidence_status: VERIFIED
    source_ids: [SRC-PUBLIC-GOES-GUILD-ARCHIVE-INVENTORY-1829-001]
    verification:
      status: public_historical_inventory_transcription
      note: "This proves a pre-1602 extraction route, not that the account books contain day-wage entries."

  - id: SC.HIST.GOES.LABOUR.STADTIMMERMAN.ANTHONIS_CLAESZ.1567_1590.001
    type: SourceClaim
    statement: "A local archival compilation identifies Anthonis Claesz / Anthonis Claiszoon as the Goese stadtimmerman in weeskamer-related material, with references in 1567, 1580 and 1590."
    claim_type: local_labour_person_target
    subject: "Anthonis Claesz / Claiszoon"
    predicate: "documented occupational role"
    object: "stadtimmerman of Goes; research target in 1567, 1580 and 1590 material"
    evidence_status: SUPPORTED
    source_ids: [SRC-SECONDARY-LEVENDale-GOES-NOTARIAL-COMPILATION-001]
    verification:
      status: secondary_local_compilation_with_primary_record_route
      note: "Use his name to target municipal payment records; no wage amount or remuneration form is established by this claim."

  - id: SC.HIST.GOES.LABOUR.CONTRACT_NOT_WAGE_BOUNDARY.1580S_1590S.001
    type: SourceClaim
    statement: "Late-sixteenth-century Goese notarial material documents building craftsmen through lump-sum contracts, valuations and disputes; these amounts are not daily wages unless the record also states labour time and a rate."
    claim_type: labour_payment_evidence_boundary
    subject: "Goese construction payments"
    predicate: "contract-versus-wage classification"
    object: "lump-sum/valuation evidence must remain distinct from day wage"
    evidence_status: SUPPORTED
    source_ids: [SRC-SECONDARY-LEVENDale-GOES-NOTARIAL-COMPILATION-001]
    verification:
      status: direct_classification_of_consulted_transaction_types
      note: "Do not divide a contract total by guessed days to manufacture a wage."

  - id: SC.HIST.WESTERN_NL.WAGES.MID16_COMPARATOR.001
    type: SourceClaim
    statement: "De Vries' Table 1 gives direct 1550-1554 construction/manual-labour comparators for several nearby or connected cities: skilled labour 5.5-6 stuivers/day and unskilled labour 3-4 in Bergen op Zoom; skilled 9 and unskilled 4 in Antwerp. These are regional comparators, not Goese wage observations."
    claim_type: regional_wage_context
    subject: "mid-sixteenth-century regional construction wages"
    predicate: "direct comparator observations"
    object: "Bergen op Zoom and Antwerp, 1550-1554"
    evidence_status: VERIFIED
    source_ids: [SRC-SECONDARY-DEVRIES-LABOUR-MARKET-GOES-WAGES-001]
    verification:
      status: direct_table_transcription
      note: "Use only as C_REGIONAL_PROXY / plausibility bounds; never relabel as Goes."

  - id: SC.HIST.WESTERN_NL.WAGES.POST1570_COMPARATOR.001
    type: SourceClaim
    statement: "De Vries documents strong post-1570 nominal-wage increases in western-Netherlands labour markets and gives detailed Spaarndam/Halfweg wage steps, but these are regional/comparative evidence rather than exact Goese wage observations."
    claim_type: regional_wage_context
    subject: "western Netherlands wage development"
    predicate: "post-1570 acceleration"
    object: "regional comparator only"
    evidence_status: SUPPORTED
    source_ids: [SRC-SECONDARY-DEVRIES-LABOUR-MARKET-GOES-WAGES-001]
    verification:
      status: direct_text_for_regional_pattern
      note: "Never relabel the Spaarndam/Halfweg wage levels as Goes."
