  tags: [goes, topography, nieuwstraat, armenhoek, continuity]
- id: STC.CORNELIS.REDERIJKERS.ZUSTERHUIS.001
  type: StoryClaim
  statement: "Cornelis' rederijker meetings in mid-sixteenth-century Goes are staged in the Zusterhuis/former Zwarte-Zusters complex at the Singelstraat; the Sint-Sebastiaanshof is not used as his meeting place because the Nardusbloem moved there only in 1626."
  canon_status: CANON
