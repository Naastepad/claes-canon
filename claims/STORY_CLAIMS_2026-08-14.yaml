  tags: [goes, residence, childhood, nieuwstraat, author-decision]
- id: STC.GOES.NIEUWSTRAAT.PRE1594.001
  type: StoryClaim
  statement: "For novel and atlas continuity, the pre-1594 deed-name Nieuwstraat is treated as an older Nieuwstraat/Oude Nieuwstraat in or by the Armenhoek, distinct from the planmatige Nieuwstraat laid out from 1594; its exact 1542 street axis remains uncertain."
  canon_status: CANON
  evidence_status: SUPPORTED
  decision_ids:
