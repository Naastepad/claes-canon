  type: StoryClaim
  statement: "In novel canon, Cornelis' household uses the house bought by historical Claes Jacobsz. Nissepat in the pre-1594 Nieuwstraat on 20 March 1542 as its Goese family home; Claes grows up there until his departure to Reimerswaal after the 1554 fire."
