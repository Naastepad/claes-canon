claims:
- id: SC.HIST.DEGHEYN.DRILL.NUMBERED_COMMAND_SYSTEM.001
  type: SourceClaim
  statement: >-
    De Gheyn's 1607 Wapenhandelinghe couples numbered figures to detailed written instructions and to an explicit ordered list of 'woorden van commandement'; it is therefore a visual-verbal drill system rather than a set of uncaptioned military illustrations.
  claim_type: primary_source_structure
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607
  predicate: combines
  object: numbered_figures_written_instruction_command_words
  evidence_status: VERIFIED
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

