- id: SC.HIST.DEGHEYN.COMMAND_WORDS.NOT_NUMBERS.001
  type: SourceClaim
  statement: >-
    In the source, the numbered figures index the corresponding explanations while the separate 'woorden van commandement' provide the verbal orders. The source does not establish that an officer's operational command consisted merely of shouting a figure number such as 'Ten achtste'.
  claim_type: interpretation_guardrail
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607
  predicate: command_language_guardrail
  object: use_command_phrases_not_unproven_number_calls
  evidence_status: VERIFIED
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

- id: SC.HIST.DEGHEYN.FIGURE8.MATCH.001
  type: SourceClaim
  statement: >-
    In the roer sequence figure/command 8 is 'U lont versoect' (English 1607: 'Try your match'): the soldier checks and adjusts the match so that it will function correctly.
  claim_type: primary_source_detail
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607.ROER.FIGURE8
  predicate: action
  object: try_and_adjust_match
  evidence_status: VERIFIED
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

- id: SC.HIST.DEGHEYN.GEEFT_ACHT.NOT_FROM_STEP8.001
  type: SourceClaim
  statement: >-
    Nothing in the De Gheyn source supports deriving the military expression 'geeft acht' from the eighth drill figure; the numeric association is to be treated as rejected speculation unless independent linguistic evidence establishes it.
  claim_type: rejected_inference
  subject: TERM.GEEFT_ACHT
  predicate: not_derived_by_this_source_from
  object: OBJ.DEGHEYN.WAPENHANDELINGHE.1607.ROER.FIGURE8
  evidence_status: VERIFIED
  evidence_boundary: This is verification of what the cited source does not establish; it is not an independent etymology of the expression.
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

- id: SC.HIST.DEGHEYN.FIRE_RELOAD_CYCLE.001
  type: SourceClaim
  statement: >-
    De Gheyn presents the firearm drill as a cycle beginning from a prepared weapon: match handling and presentation precede firing; after the shot the pan is made safe and primed, after which the main barrel is reloaded and the weapon returns to carry/readiness.
  claim_type: primary_source_process
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607.ROER
  predicate: sequence_logic
  object: prepared_weapon_to_fire_to_prime_to_reload_to_readiness
  evidence_status: VERIFIED
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

- id: SC.HIST.DEGHEYN.PRIMING_FLASK.001
  type: SourceClaim
  statement: >-
    De Gheyn explicitly distinguishes a small flask with priming/touch powder for the pan from the flask or measured charges used for the main load.
  claim_type: primary_source_material_culture
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607.FIREARM_KIT
  predicate: distinguishes
  object: priming_flask_from_main_charge_container
  evidence_status: VERIFIED
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]

- id: SC.HIST.DEGHEYN.GOES_MODEL_NOT_PROVEN.001
  type: SourceClaim
  statement: >-
    The Wapenhandelinghe does not identify the engraved soldiers as Goese or Zeeuwse troops and does not establish Goes as a model garrison, experimental drill centre, or source of De Gheyn's human models.
  claim_type: evidence_boundary
  subject: OBJ.DEGHEYN.WAPENHANDELINGHE.1607
  predicate: does_not_prove
  object: Goes_as_model_or_depicted_unit
  evidence_status: VERIFIED
  evidence_boundary: Verified as a limit of the cited source; a broader claim about Goes would require independent local evidence.
  source_ids: [SRC-HIST-DEGHEYN-WAPENHANDELINGHE-1607-001]
