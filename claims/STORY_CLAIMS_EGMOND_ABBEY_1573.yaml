  type: StoryClaim
  statement: >-
    In the Claes story world, the Abdij van Egmond around 1550 is available as an old, prestigious Holland sacral institution rather than a ruin: a place of Adelbert memory, relic prestige, pilgrimage economy, landed/archive culture and regional symbolic power.
  subject: ENT.LOC.EGMOND.ABBEY
  predicate: story_world_state
  object: prestigious_sacral_institution_around_1550
  canon_status: CANON
  evidence_status: SUPPORTED
