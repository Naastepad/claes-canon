  decisions:
  - DEC.EGMOND_ABBEY.STORY_USE.1550_1573.2026-08-16
  story_time:
    earliest: 1573-05-24
    latest_exclusive: 1573-10-09
    precision: campaign_season
  narrative_use:
    motif_links: [sacred_space, reuse, war_accounting, rumor_vs_archive]
    scene_role: indirect_context_or_counterpoint
  retrieval:
    tags: [sacred-material, war-material, alkmaar, egmond, reuse]

- id: STC.CLAES.EGMOND_ABBEY_1573.HEARS_AS_NEWS_OR_RUMOR.001
  type: StoryClaim
  statement: >-
    Claes may plausibly encounter reports about Egmond's destruction as news, rumor or retrospective argument moving through Low Countries networks; this is scene-available context only and does not establish him as an eyewitness or participant.
  subject: ENT.PERSON.CLAES_NISSEPAT
  predicate: may_hear_as_indirect_news
  object: ENT.LOC.EGMOND.ABBEY_1573_DESTRUCTION
  canon_status: CANON
  evidence_status: PLAUSIBLE
  source_claims:
  - SC.HIST.EGMOND_ABBEY.NEWS_REACHES_ZEELAND.001
  decisions:
  - DEC.EGMOND_ABBEY.CLAES_RELEVANCE.2026-08-16
  story_time:
    earliest: 1573-06-01
    latest_exclusive: 1574-01-01
    precision: plausible_interval
  guardrails:
  - Do not place Claes in Egmond without a later explicit decision.
  - Do not make Claes know the archival reconstruction at once; he may first hear a simplified or false fire report.
  - A later reflective Claes may contrast rumor with accounts/administration if the story has given him a knowledge route.
  retrieval:
    tags: [claes, egmond, news, rumor, 1573, not-eyewitness]
