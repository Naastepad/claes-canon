- id: STC.WORLD.EGMOND_ABBEY.1573.SLOOP_NOT_SIMPLE_FIRE.001
  type: StoryClaim
  statement: >-
    Claes canon treats the fall of the Abdij van Egmond in 1573 as a contested public memory: the simple 7 June fire formula is not narrator-safe as fact; the story-safe reconstruction is organised dismantling, paid labour, removal and reuse of material in the Alkmaar war context.
  subject: ENT.LOC.EGMOND.ABBEY
  predicate: story_world_1573_destruction_model
  object: systematic_dismantling_not_simple_fire
  canon_status: CANON
  evidence_status: SUPPORTED
  source_claims:
  - SC.HIST.EGMOND_ABBEY.SLOOP_1573.001
  - SC.HIST.EGMOND_ABBEY.FIRE_TRADITION_1573.001
  decisions:
  - DEC.EGMOND_ABBEY.NO_SIMPLE_FIRE.2026-08-16
  story_time:
    earliest: 1573-05-24
    latest_exclusive: 1573-08-01
    precision: bounded_reconstruction
  guardrails:
  - Do not write omniscient narrator prose saying that the abbey simply burned on 7 June 1573.
  - The 7 June fire line may appear as rumor, simplification, false memory, polemical framing or later tradition.
  - Use accounts, workmen, schuiten, beams, lead, stone and reused material as the stronger archival image.
  retrieval:
    tags: [egmond, 1573, sloop, ontmanteling, no-simple-fire, alkmaar]

- id: STC.WORLD.EGMOND_ABBEY.1573.SACRAL_MATERIAL_TO_WAR_MATERIAL.001
  type: StoryClaim
  statement: >-
    Egmond 1573 is available as a thematic world-example of sacral material becoming war material: abbey stone, lead, timber or other fabric can become part of defensive economy rather than remain protected sacred fabric.
  subject: ENT.LOC.EGMOND.ABBEY
  predicate: thematic_material_transformation
