- id: SC.HIST.GOES.SHIPPING_MILIEU.DIERICK_JANSEN.001
  type: SourceClaim
  statement: >-
    The Goese transport records attest Dierick Jansen as a schipper with urban property and a financial relation to the scheepsliedengilde in the early 1540s, supporting the presence of substantial local shipping actors without proving that he personally carried Cornelis' goods to Antwerp.
  claim_type: local_commercial_context
  subject: Dierick_Jansen_schipper
  predicate: demonstrates
  object: substantial_goese_shipping_milieu
  evidence_status: VERIFIED_IN_PROJECT_DATASET
  source_ids:
  - SRC-HIST-HOUSE-OF-LOVE-GOES-ANTWERP-1551-1569-001
  verification:
    references:
    - RAZE-1746-0188
    - RAZE-1746-0361
    note: No Antwerp route for Dierick Jansen is claimed.
