    precision: bounded
  tags:
  - education
  - location
- id: STC.CLAES.ZIERIKZEE.PLAN.001
  type: StoryClaim
  statement: Before the 1554 fire Cornelis intends Claes to move from his elementary schooling in Goes into the Latin-school route at Zierikzee; after the fire Zierikzee is abandoned as the intended destination and Reimerswaal becomes the actual route.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  subjects:
  - ENT.PERSON.CLAES
  - ENT.PERSON.CORNELIS
  tags:
  - education
  - counterfactual-plan
