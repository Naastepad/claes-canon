- id: STC.CODE.RECOVERY_SEQUENCE.001
  type: StoryClaim
  statement: The recovery architecture now separates physical reveal from key recovery: Zovitius 1570 → GALLA LEO VIRIDIS → green vitriol → memoriaal → hidden Las Casas ciphertext becomes visible; merels → theorem I–XXIV → personal Monas marginalia → 24×24 matrix → Castanea → nine Dodoens tables → Primus Index → nomenclator remains the canonical key-recovery chain, while the exact in-world entry/placement of the 24 merels problems after the memoriaal redesign is OPEN.
  canon_status: CANON
  evidence_status: SUPPORTED
  decision_ids:
  - DEC.MEMORIAAL.BREVISIMA_PRINT_GIFT.2026-08-15
  objects:
  - OBJ.ZOVITIUS_1570_TRIGGER
  - OBJ.MEMORIAAL
  - OBJ.LASCASAS_CIPHERTEXT
  - OBJ.MERELS_24
  - OBJ.MONAS_CLAES
  - OBJ.CASTANEA
  - OBJ.DODOENS_CARRIER
  - OBJ.PRIMUS_INDEX
  tags:
  - code-chain
  - open-entry-link
