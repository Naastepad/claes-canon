- id: STC.MEMORIAAL.PRINT_PROCESS.001
  type: StoryClaim
  statement: Silvius’ clandestine memoriaal print uses a clear filtered gallnut/tannin extract with gum arabic and no vitriol, soot or pigment; the canonical starting recipe is 2 drachmen gallnuts steeped in 2½ medicinal ounces clear water, 2 medicinal ounces clear extract retained, then 1½ medicinal ounces gum arabic dissolved in it, with small gum/water adjustments by print behaviour.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.MEMORIAAL.BREVISIMA_PRINT_GIFT.2026-08-15
  subjects:
  - ENT.PERSON.WILLEM_SILVIUS
  objects:
  - OBJ.MEMORIAAL
  source_refs:
  - SC.RECON.MEMORIAAL.TANNIN_GUM_PRINT.001
  tags:
  - material-process
  - technical-reconstruction
- id: STC.MEMORIAAL.GRAPHITE_RULE.001
  type: StoryClaim
  statement: Dee gives Claes a graphite stift with the memoriaal and forbids him to use ink in the book for as long as Claes remains Dee’s pupil; Claes understands this as a pedagogical rule and does not know that it also protects the tannin-loaded hidden print from iron-gall ink.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.MEMORIAAL.BREVISIMA_PRINT_GIFT.2026-08-15
  subjects:
  - ENT.PERSON.CLAES
