- id: STC.CODE.RECOVERY_SEQUENCE.001
  type: StoryClaim
  statement: The canonical recovery chain is Zovitius 1570 → GALLA LEO VIRIDIS → green vitriol → memoriaal → 24 merels problems → theorem I–XXIV → personal Monas marginalia → 24×24 matrix → Castanea → nine Dodoens tables → Primus Index → nomenclator → Las Casas.
  canon_status: CANON
  evidence_status: SUPPORTED
  objects:
  - OBJ.ZOVITIUS_1570_TRIGGER
  - OBJ.MEMORIAAL
  - OBJ.MERELS_24
  - OBJ.MONAS_CLAES
  - OBJ.CASTANEA
  - OBJ.DODOENS_CARRIER
  - OBJ.PRIMUS_INDEX
  - OBJ.LASCASAS_CIPHERTEXT
  tags:
  - code-chain
