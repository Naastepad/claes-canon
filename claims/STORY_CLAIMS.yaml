- id: STC.CLAES.REIMERSWAAL.001
  type: StoryClaim
  statement: After the Goes fire Claes is sent later in 1554 as a cost pupil to the Latin school of Reimerswaal and remains in the Reimerswaal educational environment until summer 1561; the later years are advanced/older-pupil formation rather than seven years of beginner curriculum.
  canon_status: CANON
  evidence_status: SUPPORTED
  subjects:
  - ENT.PERSON.CLAES
  objects:
