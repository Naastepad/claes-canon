  - id: STC.CLAES.EXECUTION_KNOWLEDGE.RESERVOIR.001
    type: StoryClaim
    canon_status: CANON
    evidence_status: SUPPORTED
    statement: Claes may have knowledge by witness, hearsay, rumor, merchant talk, prison talk, martyrs' books or later reading of a broad execution reservoir along his route, especially Goes, Antwerp, Middelburg, Delft, Hoorn and Enkhuizen.
