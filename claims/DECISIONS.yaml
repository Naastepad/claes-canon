schema_version: "1.0.0"
kind: CanonDecisionRegistry
decisions:
  - id: DEC.MODEL.STATUS_AXES.001
    type: ArchitectureDecision
    status: ACTIVE
    decision: "Evidence status and canon status are independent axes."
    rationale: "Historical support and fictional truth answer different questions and must not be represented by one enum."
    effects:
      - claims/SOURCE_CLAIMS.yaml
      - claims/STORY_CLAIMS.yaml
      - lemma/knowledge.lemma

  - id: DEC.MODEL.TIME_PRECISION.001
    type: ArchitectureDecision
    status: ACTIVE
    decision: "Never manufacture an exact story date from month-, season-, year- or interval-level evidence/canon."
    rationale: "The system must preserve historical and narrative uncertainty rather than create false precision."
    effects:
      - SCHEMA.md
      - lemma/knowledge.lemma
      - scripts/validate_canon.py

  - id: DEC.CLAES.DEE_ENCOUNTER.001
    type: StoryDecision
    status: ACTIVE
    decision: "Claes' first brief encounter with John Dee occurs in February 1563 in or around Silvius' Gulden Engel in Antwerp."
    evidence_status: PLAUSIBLE
    canon_status: CANON
    supported_by:
      - SC.HIST.DEE_SILVIUS.1563.001
    storybible_ref:
      master_id: SB.CLAES.MASTER
      section_hint: "Chronology / first encounter with John Dee"
    note: "The exact day remains deliberately unspecified."

  - id: DEC.CLAES.BIRTH_EDUCATION.001
    type: StoryDecision
    status: ACTIVE
    decision: "Claes is born in Goes on 8 December 1542. He receives elementary schooling in Goes. Cornelis intends Zierikzee as the next Latin-school destination, but after the Goes fire of 18 May 1554 Claes goes instead as a cost pupil to the Latin school of Reimerswaal and remains in that educational environment until the Landjuweel journey of August 1561."
    rationale: "The birth date intentionally coincides with the completion date recorded for the primitive 1542 Brevísima. The fire changes the intended school destination rather than interrupting Claes' education. The Reimerswaal period develops from Latin-school formation into an older-pupil phase before Antwerp."
    evidence_status: SUPPORTED
    canon_status: CANON
    effects:
      - claims/STORY_CLAIMS.yaml
      - entities/ENTITIES.yaml
      - narrative/arcs.yaml
      - narrative/instances.yaml
      - narrative/world_modules.yaml
      - storybible/LEMMA_MCKEE_MASTER.md
      - storybible/MASTER.md
    storybible_ref:
      master_id: SB.CLAES.MASTER
      section_hint: "Claes — cradle to grave / Goes / Reimerswaal"
    note: "Post-Revision-11 decision. It supersedes Revision 11 references that place Claes' birth on 8 December 1545."

  - id: DEC.CLAES.PUTTUS.001
    type: StoryDecision
    status: ACTIVE
    decision: "Nicolaes van de Put (Puttus) is Claes' Goese Latin master in the final pre-fire school years, approximately 1551 through spring 1554."
    rationale: "Puttus is historically documented as a successful Goese schoolmaster in 1512 whose teaching included Latin/humanist Aesop material and whom Meertens considers probably rector. A targeted August 2026 search located no death, departure or named successor that excludes Puttus from 1548–1554, and no better named Goese Latin master for Claes' years emerged. The author therefore chooses Puttus as the plausible historical bridge from Claes' elementary schooling to his intended Zierikzee and actual Reimerswaal Latin-school route."
    evidence_status: PLAUSIBLE
    canon_status: CANON
    supported_by:
      - SC.HIST.PUTTUS.GOES.1512.001
    effects:
      - claims/STORY_CLAIMS.yaml
      - entities/ENTITIES.yaml
      - narrative/world_modules.yaml
      - storybible/LEMMA_MCKEE_MASTER.md
      - storybible/MASTER.md
    storybible_ref:
      master_id: SB.CLAES.MASTER
      section_hint: "Claes — pre-Reimerswaal education / Goes"
    note: "The teacher-pupil relationship is fictional canon. Puttus' continuous tenure from 1512 to the 1550s remains historically unproved and must never be stated as fact outside the novel's story-truth layer."
