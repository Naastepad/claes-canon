  tags: [alchemy, terminology, guardrail]
- id: STC.ALCHEMY.STRONG_WATER.FAILURE.001
  type: StoryClaim
  statement: Claes learns that a strong corrosive water may attack lesser metals yet fail to open Sol; the death/opening of gold therefore requires the right compound relation of substances rather than force alone.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.ALCHEMY.GREEN_LION_SOL_CONTINUITY.2026-08-16
  subjects:
  - ENT.PERSON.CLAES
  - ENT.PERSON.JOHN_DEE
  objects:
  - OBJ.SOL_GOLD_FRACTION
  tags: [alchemy, Sol, process-law]
- id: STC.ALCHEMY.SOL.CONTINUITY.001
  type: StoryClaim
  statement: The author's hidden material model conserves Sol from its deliberate opening/dissolution through red fixation and the later Saturn/assay event; the gold made visible in 1602 was already materially present and is neither created from lead nor silently introduced at a later stage.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.ALCHEMY.GREEN_LION_SOL_CONTINUITY.2026-08-16
  objects:
  - OBJ.SOL_GOLD_FRACTION
  - OBJ.RED_LION_PROJECTIEPOEDER
  tags: [alchemy, conservation, hidden-presence]
- id: STC.ALCHEMY.CUPELLATION.INTERPRETATION.001
  type: StoryClaim
  statement: A lead/Saturn and cupellation-like assay is the novel's author-side historically disciplined explanation for how already-present hidden Sol can become visibly testable after projectio; it is not presented as a historically documented Seton procedure.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.ALCHEMY.GREEN_LION_SOL_CONTINUITY.2026-08-16
  objects:
  - OBJ.RED_LION_PROJECTIEPOEDER
  - OBJ.SOL_GOLD_FRACTION
  source_refs:
  - SRC-HIST-ERCKER-PROBIERKUNST-1574-001
  tags: [alchemy, assay, reconstruction]
- id: STC.ENKHUIZEN.SETON.FRAME.1602.001
  type: StoryClaim
  statement: The novel stages its 1602 projectio within Morhof's retrospective Seton tradition at Enkhuizen, in the house of sailor Jacob Hausfsen, on 13 March 1602 at approximately the fourth hour after noon; this frame is canon while its seventeenth-century retrospective evidence status remains explicit.
  canon_status: CANON
  evidence_status: SUPPORTED
