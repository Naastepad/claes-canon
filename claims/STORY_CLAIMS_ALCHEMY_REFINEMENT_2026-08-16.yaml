- id: STC.CASTANIENBLOEM.ORIGIN.1560S.001
  type: StoryClaim
  statement: In novel canon, a reform-minded/protestantiserende rederijker current emerges from the older Goese chamber world during the confessional polarisation and hagepreek years of the 1560s, with Cornelis in a formative role; this current becomes the Edele Castanienbloem, whose earliest surviving historical attestation remains 1595 rather than an asserted founding date.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CORNELIS.REDERIJKER.NARDUS_CASTANIE_ORIGIN.2026-08-16
  subjects:
