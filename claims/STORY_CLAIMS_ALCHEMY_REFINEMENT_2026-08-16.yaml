  story_time:
    earliest: '1563-01-01'
    latest_exclusive: '1570-01-01'
    precision: reconstruction-window
  tags: [rederijkers, Reformation, fictional-reconstruction]
- id: STC.ALCHEMY.GREEN_LION.OPERATIONAL.001
  type: StoryClaim
  statement: Within Dee and Claes' working process, green vitriol can function under the name Groene Leeuw because of its opening/revealing role; the novel does not treat Green Lion as a universal historical synonym for iron sulfate.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
