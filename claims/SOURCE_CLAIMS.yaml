  - id: SC.HIST.GOES_GROTE_KERK.BUILD.001
    type: SourceClaim
    statement: "The Goes Maria Magdalenakerk received its large surviving choir from the 1455 campaign (StoryMap: 1455–1475) and its north and south transepts around 1500 (StoryMap: 1500–1508), so these elements predate Claes' birth."
    claim_type: architectural_chronology
    subject: ENT.LOC.GOES_GROTE_KERK
    predicate: had_pre_claes_building_phases
    object: "choir and transepts"
    story_time:
      earliest: 1455-01-01
      latest_exclusive: 1509-01-01
      precision: interval
    evidence_status: SUPPORTED
    source_ids:
      - SRC-HIST-GOES-GROTEKERK-001
    supports_story_claims: []
    contradicts: []
    qualifies:
      - "The post-1618 rebuilt nave must not be back-projected unchanged into Claes' sixteenth-century church."
    verification:
      status: source_text_and_storymap_checked
      note: "Official heritage synthesis and associated StoryMap agree on the late-medieval choir/transept sequence."
    retrieval:
      tags: [goes, grote-kerk, maria-magdalena, choir, transepts, architecture]

  - id: SC.HIST.GOES_GROTE_KERK.INTERIOR.001
    type: SourceClaim
    statement: "Before the Reformation of 1578 the church was a densely furnished Catholic interior with roughly thirty large and small altars, a central high altar, sacrament tower and altar, Gospel and Epistle lecterns, a pastor's seat, guild chapels/altars, paintings and the daily Seven Hours tradition."
    claim_type: liturgical_interior
    subject: ENT.LOC.GOES_GROTE_KERK
    predicate: had_pre_reformation_catholic_interior
    object: "altars, guild chapels, liturgical furniture, paintings and Seven Hours practice"
    story_time:
      earliest: 1542-12-08
      latest_exclusive: 1578-01-01
      precision: bounded
    evidence_status: SUPPORTED
    source_ids:
      - SRC-HIST-GOES-GROTEKERK-001
    supports_story_claims: []
    contradicts: []
    qualifies:
      - "The precise positions of many nave altars and most guild chapels are explicitly unknown and must not be invented from StoryMap pins."
    verification:
      status: source_text_and_storymap_checked
      note: "The source distinguishes the richly furnished Catholic state from the later Protestant/modern interior."
    retrieval:
      tags: [goes, grote-kerk, catholic, altars, guilds, seven-hours, interior]

  - id: SC.HIST.GOES_GROTE_KERK.MAGDALENA.001
    type: SourceClaim
    statement: "The southern choir closure probably contained a shrine or chapel for Maria Magdalena, patroness of Goes, who is explicitly described as also being venerated by the Goes rhetoricians; the StoryMap places the 1552 triptych for Matthijs van der Straten in the St Maria Magdalena chapel."
    claim_type: devotional_rhetorician_context
    subject: ENT.LOC.GOES_GROTE_KERK
    predicate: linked_maria_magdalena_devotion_to_rhetoricians
    object: "probable southern Maria Magdalena shrine/chapel"
    story_time:
      earliest: 1455-01-01
      latest_exclusive: 1578-01-01
      precision: bounded
    evidence_status: SUPPORTED
    source_ids:
      - SRC-HIST-GOES-GROTEKERK-001
    supports_story_claims: []
    contradicts: []
    qualifies:
      - "The shrine/chapel identification is explicitly probable, not certain."
      - "No supplied evidence proves ownership, exclusive use or formal chapel rights for a specific rhetoricians' chamber such as the Edele Castanienbloem."
    verification:
      status: source_text_and_storymap_checked
      note: "The rhetorician connection is explicit; institutional rights are not established."
    retrieval:
      tags: [goes, maria-magdalena, rhetoricians, rederijkers, chapel, 1552]

