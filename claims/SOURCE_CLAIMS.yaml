  - id: SC.HIST.GOES_GROTE_KERK.TRANSITION.001
    type: SourceClaim
    statement: "The church's Catholic visual and liturgical order was transformed at the Reformation in 1578: saint paintings were whitewashed or removed from view, Catholic altars and the Seven Hours ceased to function, and a new pulpit was placed on a choir pillar in 1594."
    claim_type: confessional_transition
    subject: ENT.LOC.GOES_GROTE_KERK
    predicate: underwent_reformation_transition
    object: "Catholic interior to Protestant preaching church"
    story_time:
      earliest: 1578-01-01
      latest_exclusive: 1595-01-01
      precision: bounded
    evidence_status: SUPPORTED
    source_ids:
      - SRC-HIST-GOES-GROTEKERK-001
    supports_story_claims: []
    contradicts: []
    qualifies:
      - "Surviving/hidden Catholic traces such as the St Gregory Mass relief complicate any simple total-destruction model."
    verification:
      status: source_text_and_storymap_checked
      note: "The source supports a time-sensitive church state across Claes' adulthood."
    retrieval:
      tags: [goes, reformation, 1578, pulpit, 1594, whitewash, confessional-transition]
