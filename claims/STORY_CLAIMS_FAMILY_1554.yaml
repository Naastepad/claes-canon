- id: STC.CORNELIS.SALTKEET.INTEREST.1554.001
  type: StoryClaim
  statement: "In fiction canon Cornelis has a financial/economic ownership interest in one Goese salt-refining keet in the historical salt-work world associated with the 1554 fire, while daily technical operation belongs to an operational lead and workers rather than to Cornelis as zoutzieder."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CORNELIS.SALTKEET_INTEREST.1554.2026-08-21
  - DEC.CORNELIS.ECONOMIC_INTERMEDIARY.2026-08-21
  subjects:
  - ENT.PERSON.CORNELIS
  objects:
  - ENT.LOC.GOES.OOSTZELKE
  source_refs:
  - SC.HIST.GOES.SALT.NORTH_HARBOUR_1554.001
  guardrails:
  - "The economic interest is fiction canon, not archival proof of Nissepat ownership of the historical ignition keet."
  - "Exact legal ownership form, parcel and operating hierarchy remain open."
  - "Do not turn Cornelis into a daily zoutzieder."
  tags: [cornelis, salt, zoutkeet, goes, ownership, delegation, fiction-canon]

- id: STC.GOES.FIRE_1554.NISSEPAT_ATTRIBUTION.001
  type: StoryClaim
  statement: "The novel deliberately leaves the exact technical ignition and direct operational fault unresolved, while public memory and rumour increasingly attach the catastrophic origin to a keet economically associated with Cornelis and compress that complexity into the social shorthand of 'Nissepats keet'."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.GOES.FIRE_1554.CAUSAL_AMBIGUITY.2026-08-21
  subjects:
  - ENT.PERSON.CORNELIS
  - ENT.LOC.GOES
  story_time:
    earliest: '1554-05-18'
    latest_exclusive: '1555-06-01'
    precision: approximate
  source_refs:
  - SC.HIST.GOES.FIRE_1554.SPREAD.001
  guardrails:
  - "Public attribution is fiction canon; it is not evidence that the historical city accused a Nissepat."
  - "Economic ownership is not proof of technical causation."
  - "Legal liability and moral guilt remain unresolved."
  tags: [fire, rumor, blame, cornelis, uncertainty, goes]

- id: STC.CLAES.FIRE_EPISTEMIC_WOUND.1554.001
  type: StoryClaim
  statement: "Because the 1554 fire outruns Claes' normal observe-compare-understand method and reaches him through fragments, it helps form the irrational survivor possibility that seeing earlier or better might have prevented loss; this is a durable source of his later tendency to confuse attention and reconstruction with potential control."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CLAES.FIRE_EPISTEMIC_WOUND.1554.2026-08-21
  subjects:
  - ENT.PERSON.CLAES
  story_time:
    earliest: '1554-05-18'
    latest_exclusive: '1602-03-14'
    precision: developmental
  guardrails:
  - "Claes is not objectively responsible for the deaths."
  - "De Kraan remains counter-evidence that he is inherently passive; he can act instantly when no deliberative interval exists."
  tags: [claes, attention, trauma, epistemic-wound, control, reconstruction]

- id: STC.CLAES.GRANDFATHER.NISSEPAT.001
  type: StoryClaim
  statement: "For novel genealogy, historical Claes Jacobsz. Nissepat is the fictional father of Cornelis and paternal grandfather of Claes. He remains story-owner of the 1542 Nieuwstraat house through the fire, loses that property in 1554, and helps Cornelis continue paying for Claes' education afterward."
  canon_status: CANON
  evidence_status: PLAUSIBLE
