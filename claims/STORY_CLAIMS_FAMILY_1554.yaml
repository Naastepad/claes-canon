- id: STC.CLAES.EXTENDED_FAMILY.001
  type: StoryClaim
  statement: "Claes' extended novel family consists on the paternal side of historical Claes Jacobsz. Nissepat and fictional Lijsbet Pietersdochter, and on the maternal side of Tanneken's father modeled on a historical Goese Jan Jansen kuiper and fictional Mayken Pietersdochter. Jan Corneliszn. is named for his maternal grandfather in novel canon. Lijsbet has died by Claes' early childhood; the maternal-grandfather model dies around 1543 in the story; Mayken survives the 1554 fire and preserves care and family memory, while Claes Jacobsz. chiefly helps secure economic and educational continuity."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CLAES.EXTENDED_FAMILY.2026-08-14
