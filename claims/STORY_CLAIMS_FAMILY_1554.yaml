- id: STC.CLAES.CORNELIS.POSTFIRE_SEPARATION.001
  type: StoryClaim
  statement: "After the 1554 fire Cornelis remains in Goes to rebuild livelihood, business and shelter and to finance Claes' education as far as possible, partly supported by his father Claes Jacobsz. Claes goes to Reimerswaal because the intended Zierikzee route has become financially unattainable. Their geographical separation is a second loss layered onto the destruction of the household: Cornelis acts from care and duty, while Claes can experience the same act as abandonment."
