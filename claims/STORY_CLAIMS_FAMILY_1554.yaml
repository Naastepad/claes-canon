- id: STC.CLAES.CORNELIS.POSTFIRE_SEPARATION.001
  type: StoryClaim
  statement: "After the 1554 fire Cornelis remains in Goes to rebuild shelter, livelihood, credit and business and to finance Claes' education as far as possible, partly supported by his father Claes Jacobsz. Fire losses and subsequent reputational/credit erosion make the intended Zierikzee route financially or practically unattainable. Claes goes to Reimerswaal; Cornelis also intends the distance to protect him from the immediate Goese rumour environment. Their separation is a second loss layered onto the household destruction: Cornelis acts from care and duty, while Claes can experience the same act as abandonment."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CLAES.POSTFIRE_FATHER_SON.2026-08-14
  - DEC.CLAES.CORNELIS.POSTFIRE_PROTECTION_RUMOR.2026-08-21
  subjects:
  - ENT.PERSON.CLAES
  - ENT.PERSON.CORNELIS
  - ENT.PERSON.CLAES_JACOBSZ_NISSEPAT
  objects:
  - ENT.LOC.GOES
  - ENT.LOC.REIMERSWAAL
  story_time:
    earliest: '1554-05-18'
    latest_exclusive: '1561-09-01'
    precision: bounded
  tags: [father-son, separation, reimerswaal, education, rebuilding, grief, rumor, protection, author-decision]
  guardrails:
  - "Economic decline is cumulative erosion, not an instantaneous universal boycott."
  - "Exact Zierikzee-versus-Reimerswaal schooling cost remains research-open."
  - "Cornelis' Familist affiliation predates the fire; economic damage does not cause conversion."

- id: STC.CLAES.EXTENDED_FAMILY.001
  type: StoryClaim
  statement: "Claes' extended novel family consists on the paternal side of historical Claes Jacobsz. Nissepat and fictional Lijsbet Pietersdochter, and on the maternal side of Tanneken's father modeled on a historical Goese Jan Jansen kuiper and fictional Mayken Pietersdochter. Jan Corneliszn. is named for his maternal grandfather in novel canon. Lijsbet has died by Claes' early childhood; the maternal-grandfather model dies around 1543 in the story; Mayken survives the 1554 fire and preserves care and family memory, while Claes Jacobsz. chiefly helps secure economic and educational continuity."
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids:
  - DEC.CLAES.EXTENDED_FAMILY.2026-08-14
  subjects:
  - ENT.PERSON.CLAES
  - ENT.PERSON.CLAES_JACOBSZ_NISSEPAT
  - ENT.PERSON.LIJSBET_PIETERSDOCHTER
  - ENT.PERSON.JAN_JANSEN_KUIPER_MODEL
  - ENT.PERSON.MAYKEN_PIETERSDOCHTER
  - ENT.PERSON.CLAES_MOTHER
  - ENT.PERSON.CLAES_BROTHER
  source_refs:
  - SC.HIST.GOES.NISSEPAT.NIEUWSTRAAT_1542.001
  - SC.HIST.GOES.JAN_JANSEN_KUIPER.CLUSTER_1535_1544.001
  tags: [family, genealogy, grandparents, tanneken, jan, kuiper, mayken, lijsbet, author-decision]
  guardrails:
  - "Claes Jacobsz. Nissepat is historical; his kinship to fictional Cornelis is novel canon."
  - "The Jan Jansen kuiper cluster is a historical model; its identification as Tanneken's father and his circa-1543 story death are fiction."
  - "Lijsbet and Mayken are fictional."
