  subject: ENT.PERSON.NICOLAES_PUTTUS
  predicate: schoolmaster_in
  object: ENT.LOC.GOES
  story_time:
    earliest: '1512-01-01'
    latest_exclusive: '1513-01-01'
    precision: year
  evidence_status: SUPPORTED
  source_ids:
  - SRC-HIST-GOES-PUTTUS-SCHOOL-1512-1569-001
  supports_story_claims:
  - STC.CLAES.PUTTUS_MASTER.001
  qualifies:
  - The 1512 anchor does not establish continuous tenure through the 1550s.
  - No death, departure or named successor excluding Puttus from ca. 1550-1554 was located in the 18 August 2026 digital audit.
  retrieval:
    tags: [goes, puttus, schoolmaster, latin, humanism, 1512]

