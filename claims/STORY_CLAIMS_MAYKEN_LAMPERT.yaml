claims:
- id: STC.CLAES.BELOVED.MAYKEN_LAMPERT.001
  type: StoryClaim
  statement: Claes' beloved is Mayken Adriaensdr. Lampert, a fictional Goese woman born approximately in 1546 and raised in the apothecary environment attached to Adriaen Jacopsen Lampert.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14]
  subjects: [ENT.PERSON.BELOVED]
  story_time: {earliest: '1546-01-01', latest_exclusive: '1547-01-01', precision: approximate_birth_year}

- id: STC.MAYKEN.LAMPERT.FAMILY_LINK.001
  type: StoryClaim
  statement: In novel canon Mayken is the daughter of Adriaen Jacobsz. Lampert and granddaughter of the older Goese apothecary Jacob/Jacop Lampart/Lambert and his household; these kinships are explicit fiction attached to historical source anchors.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14]
  subjects: [ENT.PERSON.BELOVED, ENT.PERSON.ADRIAEN_JACOBSZ_LAMPERT, ENT.PERSON.JACOB_LAMPART_APOTHECARY]
  source_refs: [SC.HIST.GOES.LAMPERT.JACOB_ADRIAEN_GENERATION.001]
  guardrail: Do not present the father-daughter or grandfather-granddaughter relation as archival fact.

- id: STC.MAYKEN.FIRE_MEMORY.1554.001
  type: StoryClaim
  statement: Mayken is a child in Goes during the 1554 city fire and her family experiences material loss through the burned Zwaene property; she therefore shares knowledge of the catastrophe without sharing Claes' exact household bereavement.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14]
  subjects: [ENT.PERSON.BELOVED, ENT.PERSON.ADRIAEN_JACOBSZ_LAMPERT]
  source_refs: [SC.HIST.GOES.LAMPERT.ZWAENE_BURNED.1554.001]
  guardrail: Mayken's personal presence, reaction and childhood biography are fictional; only the Lampert property loss is historically anchored.

- id: STC.MAYKEN.APOTHECARY_EXPERTISE.001
  type: StoryClaim
  statement: Mayken grows up with practical access to materia medica, preparation, smell, texture, drying, measuring, botanical identification and apothecary book culture, making her a credible material and sensory counterpart to Claes.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14]
  subjects: [ENT.PERSON.BELOVED]
  guardrails:
  - Her expertise is practical and learned within the fictional household; do not convert it into an unsupported formal guild office or university education.
  - Ordinary Dodoens use may belong to her apothecary/botanical world, but no special Dodoens carrier or nomenclator function survives the no-cipher decision.

- id: STC.MAYKEN.MEMORIAAL_REVEAL_ROLE.1570.001
  type: StoryClaim
  statement: In the 1570 reveal line Mayken may assist with safe material handling, controlled testing, observation, reading and contradiction, but the hidden Brevísima is already readable language and requires no cryptographic recovery chain.
  canon_status: CANON
  evidence_status: PLAUSIBLE
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14, DEC.MEMORIAAL.DIRECT_TEXT_NO_CIPHER.2026-08-15]
  subjects: [ENT.PERSON.CLAES, ENT.PERSON.BELOVED]
  objects: [OBJ.MEMORIAAL, OBJ.LASCASAS_PLAINTEXT]
  guardrails:
  - Mayken is not a key-holder or decoder.
  - Merels, Monas, Castanea and Dodoens are not required to recover the Brevísima.

- id: STC.CLAES.MAYKEN.RELATIONSHIP.001
  type: StoryClaim
  statement: Claes and Mayken develop from separate expertise and shared Goese memory toward collaborative material verification, earned trust, love without possession and later sensory/spiritual companionship; Mayken catalyses but does not perform Claes' recovery of the sinne.
  canon_status: CANON
  evidence_status: SUPPORTED
  decision_ids: [DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14, DEC.CLAES.SINNE.2026-08-13]
  subjects: [ENT.PERSON.CLAES, ENT.PERSON.BELOVED]
  relation: REL.CLAES.BELOVED
