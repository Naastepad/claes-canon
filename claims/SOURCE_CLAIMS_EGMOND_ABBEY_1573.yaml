- id: SC.HIST.EGMOND_ABBEY.FIRE_TRADITION_1573.001
  type: SourceClaim
  statement: >-
    A conventional tradition states that the Abdij van Egmond was destroyed or set on fire on or around 7 June 1573, often framed as a military measure to prevent Spanish use of the complex.
  claim_type: historiographical_tradition
  subject: ENT.LOC.EGMOND.ABBEY
  predicate: later_tradition_claims
  object: fire_or_burning_on_or_around_1573-06-07
  story_time:
    earliest: 1573-06-07
    latest_exclusive: 1573-06-08
    precision: day_tradition
  evidence_status: DISPUTED
  source_ids: [SRC-HIST-EGMOND-ABBEY-1573-001]
  supports_story_claims: []
  contradicts:
  - SC.HIST.EGMOND_ABBEY.SLOOP_1573.001
  qualifies:
  - The existence of the tradition is supported; the tradition is not accepted here as the factual main mechanism.
  - In prose this may appear as rumor, later simplification or public framing, not as unqualified narrator fact.
  verification:
    status: tradition_attested_but_mechanism_disputed
    note: Public heritage accounts preserve the burning formula; Buitenhuis and the user-supplied material argue for paid dismantling as the stronger reconstruction.
  retrieval:
    tags: [egmond, 1573, 7-june, fire-tradition, disputed, historiography]

- id: SC.HIST.EGMOND_ABBEY.SLOOP_1573.001
  type: SourceClaim
  statement: >-
    The better current reconstruction for story use is that the Abdij van Egmond was deliberately and progressively dismantled from late May 1573 onward, with paid workers and removed materials, rather than disappearing in one simple fire event on 7 June.
  claim_type: historical_reconstruction
  subject: ENT.LOC.EGMOND.ABBEY
  predicate: destroyed_by
  object: systematic_dismantling_and_material_removal
  story_time:
    earliest: 1573-05-24
    latest_exclusive: 1573-08-01
    precision: bounded_reconstruction
  evidence_status: SUPPORTED
  source_ids: [SRC-HIST-EGMOND-ABBEY-1573-001]
  supports_story_claims:
  - STC.WORLD.EGMOND_ABBEY.1573.SLOOP_NOT_SIMPLE_FIRE.001
  contradicts:
  - SC.HIST.EGMOND_ABBEY.FIRE_TRADITION_1573.001
  qualifies:
  - Exact weekly payments, named workmen and account folios still require direct archival locator checks.
  - Fire, smoke or burned remains may appear as rumor or secondary damage only if not treated as the sole mechanism.
  verification:
    status: secondary_archival_reconstruction_supported
    note: Record as SUPPORTED pending direct inspection of the Alkmaar accounts/afrekeningboek mentioned in the prompt and secondary literature.
  retrieval:
    tags: [egmond, abdij, sloop, ontmanteling, paid-workers, 1573, alkmaar]

