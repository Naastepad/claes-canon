rules:
  MIGRATION_CHECK: "Existing canon or explicitly reviewed formulation represented in the new structure. Review only for faithful transcription/normalization; do not re-litigate the underlying canon unless a new conflict is detected."
  HUMAN_REVIEW: "AI-derived condensation or interpretation. Human should approve, edit, or reject the formulation before treating it as settled structured canon."
  HUMAN_DECISION: "Genuinely new story choice requiring explicit author decision."
  CONFLICT: "Contradictory authorities or canon drift detected. Merge is blocked until explicitly resolved and downstream records are corrected."
