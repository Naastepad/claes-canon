status_definitions:
  NORMALIZED: "Core meaning is represented by stable structured records and/or the transformed master."
  NORMALIZED_CORE: "Core canon and constraints are structured; long research detail remains available in source Revision 11 and may be atomised further on demand."
  NORMALIZED_WITH_LATER_OVERRIDES: "Source material is represented, but later explicit decisions govern conflicting details."
  SUPERSEDED_SOURCE_NORMALIZED_TO_REVEAL: "The original source architecture is preserved as development provenance while active canon uses the later reveal architecture."
  POLICY_NORMALIZED: "Operational instruction was migrated into repository policy."
  PROCESS_NORMALIZED: "Revision-control logic was migrated into repository workflow/validation."
  PRESERVED_AS_RESEARCH_CONTEXT: "Material remains context, not yet atomised into individual claims."
  SOURCE_REGISTRY_MIGRATION_IN_PROGRESS: "Material is not lost; bibliographic records continue to be atomised as needed."

