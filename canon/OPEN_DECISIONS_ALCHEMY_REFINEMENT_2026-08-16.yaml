schema_version: 1.1.0
kind: OpenDecisionSupplement
policy:
  scope: alchemical material and Enkhuizen scene design only
  note: Cornelis deken status is maintained once in canon/OPEN_DECISIONS.yaml to avoid duplicate stable IDs.
decisions:
- id: OPEN.ALCHEMY.RED_LION.CARRIER_COMPOSITION.001
  domain: alchemical_material_reconstruction
  priority: high
  question: What exact non-gold carrier/matrix composition gives the Rode Leeuw/projectiepoeder its red or dark appearance while carrying the already-present Sol fraction?
  status: OPEN
  fixed:
  - The gold-bearing fraction is materially continuous from opened Sol into the red matrix and later assay.
  - The carrier may be informed by historically plausible red iron, mercury, antimony or other mineral preparations, but none is canon yet.
  guardrails:
  - No carrier choice may introduce new gold after De dood van Sol.
  - Do not choose a composition merely for symbolic colour if it breaks period craft plausibility or the hidden-Sol conservation model.

- id: OPEN.ALCHEMY.ENKHUIZEN_1602.ASSAY_DESIGN.001
  domain: alchemical_lifeline
  priority: high
  question: Exact furnace, projection, lead/Saturn, cupellation-like assay sequence, quantities, additional witnesses and immediate aftermath for the 13 March 1602 Enkhuizen scene.
  status: OPEN
  fixed:
  - Enkhuizen; house of Jacob Hausfsen; 13 March 1602; approximately 16:00; Seton/Sidonius frame.
  - The apparent result must remain consistent with already-present hidden Sol becoming visible rather than literal lead-to-gold creation.
  - The scene must remain convincing from an early-modern witness perspective.
  guardrails:
  - Ercker supports the surrounding assay/Probierkunst culture, not Seton's exact procedure.
  - Morhof supplies the retrospective event frame, not cupellation choreography.
  - Do not turn the storybible into a modern executable transmutation recipe.
