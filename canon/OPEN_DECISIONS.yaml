- id: OPEN.CORNELIS.RESIDENCE.GOES.1542.001
  domain: spatial_continuity
  priority: high
  question: Where do Cornelis Claesz Nissepat, his wife and young Claes reside in Goes during Claes' childhood, distinct from business and family property locations?
  status: OPEN
  fixed:
  - Cornelis' residence must not be inferred from ownership, family proximity or a business site.
  - Claes is born in Goes on 8 December 1542.
  candidates:
  - the house bought by historical Claes Jacobsz Nissepat in a pre-1594 Nieuwstraat on 20 March 1542, fictionally made available to Cornelis
  - a separate intramural residence not yet identified
  - residence near the southern business environment, only if separately established
  guardrails:
  - Do not canonise residence at the Nissepad merely because Cornelis' technical/business line is associated with that corridor.
  - Once decided, synchronize the atlas route to church, market, school and business.
- id: OPEN.GOES.NIEUWSTRAAT.PRE1594.001
  domain: historical_reconstruction
  priority: high
  question: What street/place identity do the transport-register references to Nieuwstraat before 1594 represent, including Claes Jacobsz Nissepat's 1542 house?
  status: OPEN
  fixed:
  - transport acts attest a Nieuwstraat before 1594
  - the planmatige Nieuwstraat has an aanlegbesluit in 1594
  guardrails:
  - Never merge the two location identities by normalized name alone.
  - Preserve the 1542 parcel topology: street east; Jacob Dierixsen de Bye north, west and south.
- id: OPEN.GOES.REDERIJKERS.MEETINGPLACE.001
