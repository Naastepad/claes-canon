- id: OPEN.CLAES.FAMILY_FIRE_1554.001
  domain: character_and_event
  priority: high
  question: What is the fictional household-level outcome of the 18 May 1554 fire for the older-Nieuwstraat home, Claes' mother and any younger sibling(s)?
  status: RESOLVED
  resolved_by: DEC.CLAES.FAMILY_FIRE.1554.2026-08-14
  resolution:
  - the 1542 family home becomes uninhabitable or is destroyed in the fire
  - Claes and Cornelis survive because they are away from the house when the fire reaches the street
  - Tanneken Jansdochter dies in the fire while about six months pregnant
  - Jan Corneliszn. Nissepat, born about eighteen months after Claes, dies in the fire
  - the unborn child dies with Tanneken
  - 1554 becomes the first personal Nigredo and the rupture that precedes Reimerswaal
  historical_frame:
  - burned houses are explicitly documented at the corner of the older Nieuwstraat and in the Armenhoek in post-fire RAZE 1748 transport records
  - ordinary houses also continue to be transferred in Nieuwstraat after May 1554, so the street suffered mixed/partial destruction rather than total loss
  - no current source proves that the specific 1542 Nissepat parcel burned
  - no current source provides a victim list identifying members of the fictional household
  guardrails:
  - Present the house loss and casualties as explicit novel canon, not archival fact.
  - Do not invent historical victim documentation for Tanneken, Jan or the unborn child.
  - Mother and brother names are fixed by DEC.CLAES.EXTENDED_FAMILY.2026-08-14; the unborn child's sex remains open.
- id: OPEN.CLAES.EXTENDED_FAMILY.001
  domain: genealogy_and_character
  priority: medium
  question: Names, grandparents and functional distinction of Claes' paternal and maternal family lines
  status: RESOLVED
  resolved_by: DEC.CLAES.EXTENDED_FAMILY.2026-08-14
  resolution:
  - mother is Tanneken Jansdochter
  - younger brother is Jan Corneliszn. Nissepat, approximately June 1544
  - paternal grandparents are historical Claes Jacobsz. Nissepat plus fictional Lijsbet Pietersdochter
  - maternal grandparents are a fictionalized grandfather modeled on a historical Goese Jan Jansen kuiper plus fictional Mayken Pietersdochter
  - Jan is named for the maternal-grandfather figure in novel canon
  - Lijsbet dies circa 1540–1541 in story canon; the maternal-grandfather model around 1543; Mayken survives 1554
  guardrails:
  - Historical source anchors and fictional kinship must remain explicitly separated.
  - The Jan Jansen kuiper cluster may conflate same-name individuals; do not present a unique archival maternal grandfather as proven.
