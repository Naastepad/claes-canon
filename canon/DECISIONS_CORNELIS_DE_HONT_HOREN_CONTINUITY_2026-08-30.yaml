schema_version: 1.0.0
kind: CanonDecisionRegistryExtension
decisions:
- id: DEC.CORNELIS.PREFERRED_SHIPPER.AERNOULDT_DE_HONT.2026-08-30
  type: CanonDecision
  status: CANON
  decision: >-
    Aernouldt de Hont, historically documented in 1589 as a schipper van Delft who would bring beer to Goes under an agreement in which the Goese Michiel Michielsz Horen would serve as biersteker for that beer, is used in novel canon as Cornelis' recurring trusted/preferred schipper before Cornelis' death in 1569. He can carry or coordinate ordinary commercial traffic linking Delft, Goes/Zeeland and, where the story requires, Antwerp. Cornelis does not need to own a ship.
  affects:
  - ENT.PERSON.CORNELIS
  - WORLD.BEER_BREWING_DISTRIBUTION
  - WORLD.GOES_ECONOMY_1542_1572
  rationale: >-
    The historical 1589 agreement provides a concrete named schipper-biersteker relationship in Goes without proving that Horen employed De Hont as a carrier. Reusing De Hont earlier gives continuity to Cornelis' legitimate trade infrastructure while preserving the historical direction of the later agreement.
  historical_boundary:
  - Historical fact: on 2 May 1589 Aernouldt de Hont is called schipper van Delft and the parties agree that Michiel Horen will be biersteker for beers De Hont brings to Goes.
  - The consulted extract does not establish beer ownership, freight payer, commission, exclusivity, cargo-risk allocation or the omitted contractual conditions.
  - Historical fact does not currently establish De Hont's age, career start, presence in Goes before 1589, Antwerp voyages, vessel type, vessel ownership, or a relationship with any Nissepat.
  - His pre-1569 service to fictional Cornelis is therefore an explicit novel backprojection, not archival fact.
  authoring_rule: >-
    De Hont is primarily the continuity carrier: the man who knows routes, freight practice, recipients and commercial habits before and after Cornelis. Do not invent a precise birth year, vessel name, fixed sailing timetable, ownership structure, freight rate or risk clause. If a scene requires a vessel image, use a generic period schuit-family cargo craft; kromsteven schuit and krabschuit are supported regional analogues, not De Hont identifications.

- id: DEC.CORNELIS.TRADE_SUCCESSION.MICHIEL_HOREN.2026-08-30
  type: CanonDecision
  status: CANON
  decision: >-
    Cornelis' death in 1569 does not make his beer-distribution network disappear. In novel canon, part of the surviving commercial line is eventually absorbed or continued by Michiel Michielsz Horen, who later becomes a Goese biersteker. The continuity is carried especially through Aernouldt de Hont and surviving route knowledge. By 1589 the historically documented arrangement in which Horen is biersteker for beers De Hont brings to Goes functions as the visible archival endpoint of this fictional business succession.
  affects:
  - ENT.PERSON.CORNELIS
  - WORLD.BEER_BREWING_DISTRIBUTION
  - WORLD.GOES_ECONOMY_1542_1572
  rationale: >-
    This turns the real 1589 agreement into a meaningful afterlife of Cornelis' trade rather than an unrelated late-century analogue, while avoiding the unsupported claim that Horen hired De Hont or directly bought a Nissepat business.
  historical_boundary:
  - Michiel Horen is historically documented as having lived formerly in Aardenburg and as a Goese poorter by 1588; in 1589 he is documented as biersteker for beers Aernouldt de Hont would bring to Goes.
  - Current evidence does not place Horen in Goes in 1569 and does not prove that he purchased, inherited or directly succeeded a Nissepat business.
  - The 1589 extract also does not prove that Horen owned the incoming beer or employed De Hont as freight carrier.
  - Therefore the succession is gradual/fictional and must not be written as a documented immediate transfer at Cornelis' death.
  authoring_rule: >-
    Prefer a discontinuous succession: after 1569 accounts, customers, cask relations and route knowledge can fragment through family, creditors and wartime disruption; Horen later consolidates or takes over part of that surviving local biersteker function. De Hont supplies the human continuity between the two eras.

- id: DEC.CORNELIS.DE_HONT.ROUTE_SCOPE.2026-08-30
  type: CanonDecision
  status: CANON
  decision: >-
    For story purposes De Hont may serve both the beer-distribution side and selected salt/export movements, including Antwerp, but exact routing is transaction-specific. Delft-to-Zeeland beer movement is historically well supported as a wider mechanism, while De Hont's pre-1569 Nissepat and Antwerp traffic remain fictional extensions constrained by period maritime commerce.
  affects:
  - ENT.PERSON.CORNELIS
  - WORLD.BEER_BREWING_DISTRIBUTION
  - WORLD.GOES_ECONOMY_1542_1572
  guardrails:
  - Do not describe Delft-Goes-Antwerp as a fixed scheduled line without evidence.
  - Do not imply every beer load or every salt consignment used De Hont.
  - Do not turn De Hont into a clandestine bookseller by occupation; sensitive cargo through his route requires separate plot authorization.
  - Do not assign an exact Delft-Goes or Goes-Antwerp transit time from the current evidence. Write movement in tides, weather windows and days rather than modern timetable precision.
  - Do not assign De Hont a fixed cargo capacity. A 1589 Goese freight act proves that 52 beer tons could move as one regional consignment, but it is not De Hont evidence.
  - Do not infer contractual cargo-risk allocation from generic maritime custom while the 1589 act's omitted conditions remain unrecovered.
