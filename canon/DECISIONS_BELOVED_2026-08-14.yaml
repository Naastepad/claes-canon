schema_version: 1.0.0
kind: CanonDecisionRegistry
decisions:
- id: DEC.CLAES.BELOVED.MAYKEN_LAMPERT.2026-08-14
  type: CanonDecision
  status: CANON
  decision: Claes' beloved is Mayken Adriaensdr. Lampert, a fictional woman born circa 1546 in Goes and fictionally made the daughter of Adriaen Jacopsen Lampert within the historically attested Goese Lampart/Lambert apothecary milieu.
  affects:
  - STC.CLAES.BELOVED.MAYKEN_LAMPERT.001
  - STC.MAYKEN.LAMPERT.BIRTH.001
  - STC.MAYKEN.LAMPERT.HISTORICAL_FRAME.001
  - STC.MAYKEN.CLAES.RECOVERY_ROLE.001
  - ENT.PERSON.BELOVED
  - REL.CLAES.BELOVED
  - OPEN.CLAES.BELOVED.IDENTITY.001
  rationale: The author explicitly approved the researched proposal. The name Mayken is historically anchored inside the Lampart milieu by a 1543 deed naming Mayken, wife of Jacop Lampart. No historical daughter of Adriaen has been found, so Mayken's existence and kinship remain explicit fiction.
  guardrails:
  - Do not present Mayken as a documented historical daughter of Adriaen Jacopsen Lampert.
  - Do not present Adriaen Jacopsen apteker equals Adriaen Jacopsen Lampert as deed-explicit; the identification is strongly supported but not yet verified by an explicit bridge.
  - Do not present Adriaen as the proved son of Jacob Lambert/Lampart; that succession remains plausible reconstruction.
  - Mayken's mother is not yet fixed.
  - Mayken may know the 1554 fire through her family environment, but her fictional household losses must not duplicate Claes' losses unless separately decided.
