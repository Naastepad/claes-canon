schema_version: 1.1.0
kind: OpenDecisionSupplement
decisions:
- id: OPEN.CORNELIS.CASTANIE.DEKEN.001
  domain: character_and_rederijker_network
  priority: high
  question: Is Cornelis merely a member of De Edele Castanienbloem or also deken during the relevant Antwerp/book-transport period?
  status: OPEN
  fixed:
  - Cornelis is a member of De Edele Castanienbloem.
  - Cornelis is a Goes poorter and biersteker.
  - Cornelis' beer-route/civic/rederijker position can support book-transport plausibility.
  guardrails:
  - Do not write Cornelis as deken until this is explicitly closed.
  - Do not use deken status to justify plot mechanics that can already be justified by poorter/member/biersteker/trust networks.
- id: OPEN.ALCHEMY.ENKHUIZEN_1602.EVENT_DESIGN.001
  domain: alchemical_lifeline
  priority: high
  question: Exact scene design, witnesses, assay/cupellation logic, risk level and moral consequence of the 1602 Enkhuizen transmutation/projectio event.
  status: OPEN
  fixed:
  - Alexander Seton is the historical-alchemical catalyst in the Enkhuizen 1602 projectio climax.
  - The 1602 Enkhuizen event is the outward projectio of Claes' projectiepoeder line.
  - Claes' completed projectiepoeder/Rode Leeuw is deep red to red-brown, never green or visibly gold-yellow.
  - Groene Leeuw/vitriol belongs upstream to revelation, opening and digestion, not to the final projection powder.
  - The event remains chemically interpretable as hidden Sol becoming visible through process/test/assay, not literal lead-to-gold creation.
  - The event must force Claes toward release rather than ownership of the Work.
  - Historical Seton tradition and fictional Claes material logic must remain distinguishable.
  unresolved:
  - Is Jacob Hanssen/Haussen's 1601 Scottish landfall an accidental shipwreck, a deliberately risky approach, or a cover story for a mission?
  - If Hanssen is seeking Seton, who sends him and what exactly does the sender know?
  - Is the motive connected to the hidden/memorial book as a material problem rather than a cipher that only Seton can decode?
  - Does Claes meet Seton before the projection, and if so under what pretext?
  - Who supplies the lead, crucible, fire and assay materials?
  - Does Seton touch the working materials or deliberately leave handling to witnesses?
  - Is Claes an operator, witness, evaluator or silent recognizer during the event?
  - Which historically plausible tests are actually performed in-scene: touchstone, acid comparison, cupellation-like assay, weighing, malleability, or another goldsmith's test?
  - Who is physically present beyond Seton, Hanssen/Haussen and any Van der Linden figure?
  - Is the event private, semi-private or allowed to become public only through subsequent retelling?
  - Who keeps the resulting gold and how does its material witness-chain intersect with the historical tradition?
  - What does Seton recognize in Claes, and what do the two deliberately leave unsaid?
  - What immediate choice or relinquishment by Claes proves that projectio has become release rather than possession?
  guardrails:
  - Do not write a modern complete recipe.
  - Do not close witnesses, location details, mission theory, assay sequence or public/private degree without a separate decision.
  - Do not make metallic success the final moral meaning of the novel.
  - Do not make Hanssen's secret mission historical fact; it is a story hypothesis until explicitly closed as fiction-canon.
  - Do not claim Seton's historical Enkhuizen powder was red or green; the surviving tradition does not securely establish that for this event.
  - Do not make Seton the sole decoder of the hidden book if this contradicts the established tannin/vitriol material-revelation mechanism.
